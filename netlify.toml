[build]
  command = "npm run typecheck"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["mongoose", "mongodb", "@node-rs/argon2"]

[dev]
  port = 8888
  functionsPort = 9999
  autoLaunch = false
  framework = "#static"
  publish = "."

[context.dev.environment]
  NODE_ENV = "development"

# No `/api/v1` redirects. Every API function routes itself through its own
# `config.path` and `method` (Netlify Functions v2). A forced redirect matches
# every method, so it once sent a GET to a POST-only function on a shared path
# (teacher-login 05, list-round-chains 01). The pack and chains redirects went
# first; the session and account ones were removed in api-completion ticket 10.
# A test (tests/adapters/netlify-toml-redirects.test.ts) fails if one returns.
