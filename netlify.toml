[build]
  command = "npm run typecheck"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["mongoose", "mongodb", "@node-rs/argon2"]

[dev]
  port = 8888
  functionsPort = 9999
  autoLaunch = false
  framework = "#static"
  publish = "."

[context.dev.environment]
  NODE_ENV = "development"

# API Routes - direct to Netlify Functions (force = true ensures no fallback)
[[redirects]]
  from = "/api/v1/sessions"
  to = "/.netlify/functions/create-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/sessions/join"
  to = "/.netlify/functions/join-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/sessions/:sessionId"
  to = "/.netlify/functions/get-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/sessions/:sessionId/phase"
  to = "/.netlify/functions/transition-phase"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/sessions/:sessionId/rounds/:roundNumber/chains"
  to = "/.netlify/functions/submit-chain"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/sessions/:sessionId/assessments/:stage"
  to = "/.netlify/functions/submit-assessment"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/sessions/:sessionId/survey"
  to = "/.netlify/functions/submit-survey"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/sessions/:sessionId/rounds/:roundNumber/chains/:chainId/adjudicate"
  to = "/.netlify/functions/adjudicate-chain"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/sessions/:sessionId/rounds/:roundNumber/standings"
  to = "/.netlify/functions/get-standings"
  status = 200
  force = true

# Curriculum Pack routes have no redirects: each pack function routes itself
# through its own `config.path` and `method` (Netlify Functions v2). A forced
# redirect from `/api/v1/packs` sent every method to the list function, so a
# POST to the documented registration path could miss the register function
# (teacher-login ticket 05). `/api/v1/packs/register` was never documented.

[[redirects]]
  from = "/api/v1/accounts/sign-up"
  to = "/.netlify/functions/sign-up"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/accounts/sign-in"
  to = "/.netlify/functions/sign-in"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/accounts/me"
  to = "/.netlify/functions/get-current-account"
  status = 200
  force = true
