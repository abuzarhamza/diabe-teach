openapi: 3.1.0
info:
  title: Concept-Chain Educational Game Platform API (Diabe-teach)
  version: 1.0.0
  description: >
    Subject-agnostic HTTP REST + Server-Sent Events (SSE) API for running
    associative concept-chaining board games (with **Diabe-teach** as the
    inaugural built-in Curriculum Pack).
  license:
    name: CC-BY-NC-ND-4.0
    url: https://creativecommons.org/licenses/by-nc-nd/4.0/

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Accounts
    description: Instructor Account sign-up and sign-in, which issue Account Tokens
  - name: Packs
    description: >-
      The shared Curriculum Pack library: discovery, plus validation,
      registration, new Pack Versions, archiving and unarchiving with an
      Account Token
  - name: Sessions
    description: Game Session creation, classroom room join, phase transitions, and SSE stream
  - name: Chains
    description: Concept Chain submission, peer/AI/instructor adjudication, and round standings
  - name: Assessments & Analytics
    description: Pretest/Posttest Assessment Attempts, Likert perception survey, and metacognitive analytics

paths:
  /api/v1/accounts/sign-up:
    post:
      operationId: signUpInstructor
      tags: [Accounts]
      summary: Create an Instructor Account with an email and a password, and sign it in
      description: >-
        Anyone with an email can sign up: no verification email and no
        university check in the proof-of-concept phase. The email is trimmed
        and lower-cased before it is stored, and must be unique. The password
        must be at least 10 characters; it is stored only as an argon2id hash.
        Any `Authorization` header is ignored.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCredentialsRequest"
      responses:
        "201":
          description: Instructor Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTokenResponse"
        "400":
          description: >-
            INVALID_REQUEST_BODY. The body is not a JSON object, the email is
            missing or not shaped like an email, or the password is missing or
            under 10 characters. `details.field` names the field. Nothing is
            stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: UNAUTHORIZED_TOKEN. Missing or invalid x-api-key header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: >-
            EMAIL_ALREADY_REGISTERED. An Instructor Account already has this
            email, compared after trimming and lower-casing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/accounts/sign-in:
    post:
      operationId: signInInstructor
      tags: [Accounts]
      summary: Sign in to an Instructor Account and receive a 12-hour Account Token
      description: >-
        The email is trimmed and lower-cased before the lookup. Any
        `Authorization` header is ignored.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCredentialsRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTokenResponse"
        "400":
          description: INVALID_REQUEST_BODY. The body is not a JSON object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: >-
            INVALID_CREDENTIALS with the message "Email or password is
            incorrect." for an unknown email, a wrong password, or a missing
            field: the same body every time, so the response never reveals
            which emails have accounts. (UNAUTHORIZED_TOKEN for a missing or
            invalid x-api-key header.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "423":
          description: >-
            ACCOUNT_TEMPORARILY_LOCKED. Five wrong passwords in a row lock the
            Instructor Account for 15 minutes; the fifth wrong password itself
            gets this response. While locked, every sign-in attempt gets it,
            even with the right password, and does not extend the lock.
            `details.lockedUntil` is the ISO 8601 time the lock ends. A
            successful sign-in resets the wrong-password count. Unknown emails
            are never locked; they always get 401.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: ACCOUNT_TEMPORARILY_LOCKED
                message: Too many wrong passwords. Sign-in is temporarily locked; try again later.
                details:
                  lockedUntil: "2026-11-19T08:15:00.000Z"

  /api/v1/accounts/me:
    get:
      operationId: getCurrentInstructorAccount
      tags: [Accounts]
      summary: The Instructor Account the Account Token belongs to
      security:
        - ApiKeyAuth: []
          AccountAuth: []
      responses:
        "200":
          description: The signed-in Instructor Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorAccountView"
        "401":
          description: >-
            UNAUTHORIZED_TOKEN. No Account Token, or one that is malformed,
            tampered, expired, or of another kind (a Capability Token is
            never accepted here).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/packs:
    get:
      operationId: listCurriculumPacks
      tags: [Packs]
      summary: List the shared library's Curriculum Packs
      description: >-
        Lists the latest Pack Version of every pack, with the author handle of
        the teacher who released that version (the part of their email before
        the @, worked out when the list is read and never stored) and its
        version, so Game setup can show "by rahman.s · v1.1.0". Packs whose
        latest version was not released by an Instructor Account (older packs
        and System Packs) have a null `authorHandle` ("by unknown"). No full
        email address appears in the response. Archived packs are hidden
        unless `includeArchived=true`.
      parameters:
        - name: includeArchived
          in: query
          required: false
          description: >-
            `true` also lists packs whose latest version is archived, marked
            `isArchived: true`, for Game setup's "Show archived". Any other
            value, or none, hides them.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The latest Pack Version of each listed pack
          content:
            application/json:
              schema:
                type: object
                required: [packs]
                properties:
                  packs:
                    type: array
                    items:
                      $ref: "#/components/schemas/CurriculumPackListItem"
    post:
      operationId: registerCurriculumPack
      tags: [Packs]
      summary: Validate and register a Curriculum Pack, or release a new Pack Version of one
      description: >-
        Needs a signed-in teacher's Account Token (`AccountAuth`); no Game
        Session is needed, and an instructor Capability Token is refused.
        The pack library is shared: any signed-in teacher may register a new
        pack, or release a new Pack Version of any pack (including a
        colleague's) by registering the same `id` with a new `version`. Each
        Pack Version records the releasing account id as `createdBy`. A new
        version always starts unarchived, so releasing a new version of an
        archived pack lists it again. System Packs refuse new versions (403),
        and an existing `id` and `version` is never overwritten (409).
      security:
        - ApiKeyAuth: []
          AccountAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumPackInput"
      responses:
        "201":
          description: Curriculum Pack validated and registered
          content:
            application/json:
              schema:
                type: object
                required: [pack]
                properties:
                  pack:
                    $ref: "#/components/schemas/CurriculumPackSummary"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          description: >-
            UNAUTHORIZED_TOKEN. No Account Token, or one that is malformed,
            tampered, expired, or of another kind. An instructor Capability
            Token is not accepted on pack routes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: >-
            PACK_IS_SYSTEM_PACK. The pack id belongs to a System Pack, which
            users cannot release new versions of.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: >-
            PACK_ALREADY_EXISTS. That pack id and version are already
            registered (by anyone); release a new version instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: >-
            PACK_VALIDATION_FAILED. The Curriculum Pack failed structural or
            topological validation; the response lists every issue. This
            includes INSUFFICIENT_CARDS when the pack has fewer Keyword Cards
            than its `boardConfig.rows × boardConfig.cols` board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/packs/validate:
    post:
      operationId: validateCurriculumPack
      tags: [Packs]
      summary: Validate a draft Curriculum Pack payload without registering it
      description: >-
        Needs a signed-in teacher's Account Token (`AccountAuth`), so packs
        can be prepared before any Game Session exists. An instructor
        Capability Token is refused.
      security:
        - ApiKeyAuth: []
          AccountAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumPackInput"
      responses:
        "200":
          description: Validation result with any structural or topological issues
          content:
            application/json:
              schema:
                type: object
                required: [valid, issues]
                properties:
                  valid:
                    type: boolean
                  issues:
                    type: array
                    items:
                      $ref: "#/components/schemas/PackValidationIssue"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          description: >-
            UNAUTHORIZED_TOKEN. No Account Token, or one that is malformed,
            tampered, expired, or of another kind. An instructor Capability
            Token is not accepted on pack routes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/packs/{packId}:
    get:
      operationId: getCurriculumPackById
      tags: [Packs]
      summary: Fetch a Curriculum Pack by ID (redacts assessment answer keys unless instructorToken is supplied)
      security:
        - ApiKeyAuth: []
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: packId
          in: path
          required: true
          schema:
            type: string
          examples:
            diabeTeach:
              value: diabe-teach
      responses:
        "200":
          description: Curriculum Pack details
          content:
            application/json:
              schema:
                type: object
                required: [pack]
                properties:
                  pack:
                    $ref: "#/components/schemas/PublicCurriculumPack"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/packs/{packId}/archive:
    post:
      operationId: archiveCurriculumPack
      tags: [Packs]
      summary: Archive a Curriculum Pack (hides it from the list; nothing is deleted)
      description: >-
        Any signed-in teacher may archive any pack except a System Pack,
        including a colleague's (ADR-0007). Archives the latest Pack Version
        and records the acting account and the time. Game Sessions already
        using the pack keep working. There is no delete route.
      security:
        - ApiKeyAuth: []
          AccountAuth: []
      parameters:
        - name: packId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The pack is archived
          content:
            application/json:
              schema:
                type: object
                required: [packId, isArchived, archivedAt, archivedBy]
                properties:
                  packId:
                    type: string
                  isArchived:
                    type: boolean
                    const: true
                  archivedAt:
                    type: string
                    format: date-time
                  archivedBy:
                    type: string
                    description: The Instructor Account id that archived the pack.
        "401":
          description: >-
            UNAUTHORIZED_TOKEN. No Account Token, or one that is malformed,
            tampered, expired, or of another kind. An instructor Capability
            Token is not accepted on pack routes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: PACK_IS_SYSTEM_PACK. System Packs cannot be archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: PACK_ALREADY_ARCHIVED. The pack is already archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/packs/{packId}/unarchive:
    post:
      operationId: unarchiveCurriculumPack
      tags: [Packs]
      summary: Unarchive a Curriculum Pack so it is listed again
      description: >-
        Any signed-in teacher may unarchive any archived pack (ADR-0007).
        Records the acting account and the time; the last archive stays on
        record.
      security:
        - ApiKeyAuth: []
          AccountAuth: []
      parameters:
        - name: packId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The pack is no longer archived
          content:
            application/json:
              schema:
                type: object
                required: [packId, isArchived, unarchivedAt, unarchivedBy]
                properties:
                  packId:
                    type: string
                  isArchived:
                    type: boolean
                    const: false
                  unarchivedAt:
                    type: string
                    format: date-time
                  unarchivedBy:
                    type: string
                    description: The Instructor Account id that unarchived the pack.
        "401":
          description: >-
            UNAUTHORIZED_TOKEN. No Account Token, or one that is malformed,
            tampered, expired, or of another kind. An instructor Capability
            Token is not accepted on pack routes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: PACK_NOT_ARCHIVED. The pack is not archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/sessions:
    post:
      operationId: createGameSession
      tags: [Sessions]
      summary: Create a new Game Session (auto-joins and starts Round 1 when mode is "solo")
      description: >-
        A **classroom** (or any non-solo) Game Session needs a signed-in
        teacher: send an Account Token (`AccountAuth`). The session records
        that Instructor Account as its owner. A **solo** session needs no
        Account Token and records no owner. Either way the response returns
        the per-session `instructorToken` Capability Token, and every in-game
        route (state, phase transition, adjudication, standings) keeps using
        it, so the Account Token expiring or the teacher signing out never
        breaks a running game. `creatorDisplayName` stays a per-game choice.
      security:
        - ApiKeyAuth: []
          AccountAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Game Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          description: >-
            UNAUTHORIZED_TOKEN. A classroom (non-solo) start sent no Account
            Token, or any start sent one that is malformed, tampered, expired,
            or of another kind (an instructor Capability Token is never
            accepted here). No session is created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          description: >-
            PACK_VALIDATION_FAILED. The Curriculum Pack has fewer Keyword Cards
            than its `boardConfig.rows × boardConfig.cols` board, so a Game
            Session could not deal a full board. This guards packs stored
            before registration enforced the rule. `details` carries `packId`,
            `cardCount`, `rows`, `cols` and `requiredCardCount`. No session is
            created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/sessions/join:
    post:
      operationId: joinGameSession
      tags: [Sessions]
      summary: Join an active Game Session via roomCode and receive a participantToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinSessionRequest"
      responses:
        "200":
          description: Joined Game Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: >-
            CONCURRENT_UPDATE_CONFLICT. Other requests kept changing the Game
            Session while this one was being saved, and it still conflicted
            after 3 attempts. Nothing was recorded. Safe to retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/sessions/{sessionId}:
    get:
      operationId: getGameSessionState
      tags: [Sessions]
      summary: Get current Game Session state snapshot
      parameters:
        - $ref: "#/components/parameters/SessionIdParam"
      responses:
        "200":
          description: Current Game Session state snapshot
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    $ref: "#/components/schemas/PublicSessionState"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/sessions/{sessionId}/stream:
    get:
      operationId: streamGameSessionEvents
      tags: [Sessions]
      summary: Subscribe to real-time Server-Sent Events (SSE) for a Game Session
      parameters:
        - $ref: "#/components/parameters/SessionIdParam"
      responses:
        "200":
          description: Server-Sent Events stream emitting typed session updates
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEventEnvelope"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/sessions/{sessionId}/phase:
    post:
      operationId: transitionSessionPhase
      tags: [Sessions]
      summary: Advance or transition the Game Session phase (shuffles a fresh board on Round 1 & Round 2 entry)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionPhaseRequest"
      responses:
        "200":
          description: Phase transitioned
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    $ref: "#/components/schemas/PublicSessionState"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: >-
            INVALID_PHASE_TRANSITION. The requested phase does not follow the current phase.

            CONCURRENT_UPDATE_CONFLICT. Other requests kept changing the Game
            Session while this one was being saved, and it still conflicted
            after 3 attempts. Nothing was recorded. Safe to retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/sessions/{sessionId}/rounds/{roundNumber}/chains:
    get:
      operationId: listRoundChains
      tags: [Chains]
      summary: List the Concept Chains of a Gameplay Round that the caller may see
      description: >-
        Returns the Gameplay Round's Concept Chains, each in the same
        `SubmittedChain` shape that submit and adjudicate return (path,
        keywords, narrative, step rationales, status, peer votes, verdict),
        sorted by `submittedAt` ascending, then `chainId`. A round with no
        chains, or one that has not started yet, returns 200 with an empty
        `chains` list.


        Visibility: the session's instructor Capability Token sees every chain
        of the round, in any phase. A participant Capability Token sees only
        that participant's own chains, in every phase.


        Teachers call this with the session's instructor Capability Token, not
        an Account Token (ADR-0007).
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionIdParam"
        - $ref: "#/components/parameters/RoundNumberParam"
      responses:
        "200":
          description: The round's Concept Chains the caller may see, in submission order
          content:
            application/json:
              schema:
                type: object
                required: [roundNumber, chains]
                properties:
                  roundNumber:
                    type: integer
                    enum: [1, 2]
                  chains:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubmittedChain"
        "400":
          description: >-
            INVALID_REQUEST_BODY. `roundNumber` is not 1 or 2.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: >-
            UNAUTHORIZED_TOKEN. No bearer token, or one that is malformed,
            invalid, expired, or an Account Token instead of a Capability
            Token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: >-
            FORBIDDEN_ROLE. The Capability Token belongs to another Game
            Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: SESSION_NOT_FOUND. No Game Session has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    post:
      operationId: submitConceptChain
      tags: [Chains]
      summary: Submit a Concept Chain during the chain-mapping sub-phase
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionIdParam"
        - $ref: "#/components/parameters/RoundNumberParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitChainRequest"
      responses:
        "201":
          description: Concept Chain passed topological validation and was recorded
          content:
            application/json:
              schema:
                type: object
                required: [chain]
                properties:
                  chain:
                    $ref: "#/components/schemas/SubmittedChain"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: >-
            PHASE_CLOSED_FOR_SUBMISSIONS. Either the round is not in the
            chain-mapping sub-phase, the chain was sent to a round other than
            the session's active round, or the chain arrived more than 5 seconds
            (the fixed grace period) after the session's `phaseEndsAt`. An
            expired chain-mapping phase stays current, closed for submissions,
            until the instructor transitions to peer-adjudication.

            CHAIN_ALREADY_SUBMITTED. The participant already submitted this
            Concept Chain in this round: the same board cells in the same or
            exactly reverse order (the narrative is ignored). Nothing is
            recorded. Other participants may submit the same chain.

            CONCURRENT_UPDATE_CONFLICT. Other requests kept changing the Game
            Session while this one was being saved, and it still conflicted
            after 3 attempts. Nothing was recorded. Safe to retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Concept Chain failed topological validation (CHAIN_TOPOLOGY_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/sessions/{sessionId}/rounds/{roundNumber}/chains/{chainId}/adjudicate:
    post:
      operationId: adjudicateConceptChain
      tags: [Chains]
      summary: Cast a peer vote, trigger AI evaluation, or record an Instructor Final Ruling on a Concept Chain
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionIdParam"
        - $ref: "#/components/parameters/RoundNumberParam"
        - name: chainId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjudicateChainRequest"
      responses:
        "200":
          description: Updated Concept Chain with latest votes and adjudication verdict
          content:
            application/json:
              schema:
                type: object
                required: [chain]
                properties:
                  chain:
                    $ref: "#/components/schemas/SubmittedChain"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: >-
            ADJUDICATION_LOCKED_BY_INSTRUCTOR. The chain verdict is locked by an Instructor Final Ruling.

            CONCURRENT_UPDATE_CONFLICT. Other requests kept changing the Game
            Session while this one was being saved, and it still conflicted
            after 3 attempts. Nothing was recorded. Safe to retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/sessions/{sessionId}/rounds/{roundNumber}/standings:
    get:
      operationId: getRoundStandings
      tags: [Chains]
      summary: Get ranked round standings (longest approved chain primary, total distinct approved chains tie-breaker)
      parameters:
        - $ref: "#/components/parameters/SessionIdParam"
        - $ref: "#/components/parameters/RoundNumberParam"
      responses:
        "200":
          description: Ranked standings for the specified round
          content:
            application/json:
              schema:
                type: object
                required: [roundNumber, isFinalized, standings]
                properties:
                  roundNumber:
                    type: integer
                    enum: [1, 2]
                  isFinalized:
                    type: boolean
                  standings:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlayerRoundStanding"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/sessions/{sessionId}/assessments/{stage}:
    post:
      operationId: submitAssessmentAttempt
      tags: [Assessments & Analytics]
      summary: Submit a one-shot Pretest or Posttest Assessment Attempt (with explicit I_DONT_KNOW support)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionIdParam"
        - name: stage
          in: path
          required: true
          schema:
            type: string
            enum: [pretest, posttest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAssessmentRequest"
      responses:
        "201":
          description: >
            Assessment Attempt recorded. Pretest returns an ungraded receipt to preserve
            answer-key secrecy; Posttest returns the full LearnerMetacognitiveReport and answer key review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSubmissionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: >-
            ASSESSMENT_ALREADY_SUBMITTED. The participant has already submitted this assessment stage.

            PHASE_CLOSED_FOR_SUBMISSIONS. The session is not in this stage's
            phase, or a posttest was sent before the participant's pretest.

            CONCURRENT_UPDATE_CONFLICT. Other requests kept changing the Game
            Session while this one was being saved, and it still conflicted
            after 3 attempts. Nothing was recorded. Safe to retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Missing answer choices for one or more questions (ASSESSMENT_INCOMPLETE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/sessions/{sessionId}/survey:
    post:
      operationId: submitPerceptionSurvey
      tags: [Assessments & Analytics]
      summary: Submit 5-point Likert perception survey ratings
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitSurveyRequest"
      responses:
        "201":
          description: Perception survey recorded
          content:
            application/json:
              schema:
                type: object
                required: [participantId, recordedItemCount, submittedAt]
                properties:
                  participantId:
                    type: string
                  recordedItemCount:
                    type: integer
                  submittedAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: >-
            SURVEY_ALREADY_SUBMITTED. This participant has already submitted the perception survey.

            PHASE_CLOSED_FOR_SUBMISSIONS. The session is not in the feedback-survey phase.

            CONCURRENT_UPDATE_CONFLICT. Other requests kept changing the Game
            Session while this one was being saved, and it still conflicted
            after 3 attempts. Nothing was recorded. Safe to retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityError"

  /api/v1/sessions/{sessionId}/analytics:
    get:
      operationId: getSessionAnalytics
      tags: [Assessments & Analytics]
      summary: Fetch individual learner or full cohort metacognitive and gameplay analytics
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionIdParam"
      responses:
        "200":
          description: Learner or cohort analytics report depending on caller role token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAnalyticsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        Global client API key required on `/api/v1/*` requests when `API_KEY`
        is configured.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SessionCapabilityToken
      description: >
        Pass either an `instructorToken` (returned on session creation) or a
        `participantToken` (returned on session join or solo session creation).
        These Capability Tokens carry `kind: "capability"`; an Account Token
        sent here is rejected with 401 UNAUTHORIZED_TOKEN.
    AccountAuth:
      type: http
      scheme: bearer
      bearerFormat: AccountToken
      description: >
        An Account Token, returned by `signUpInstructor` and
        `signInInstructor`: an HS256 JWT signed with its own secret
        (`ACCOUNT_TOKEN_SECRET`), carrying `kind: "account"`, the account id
        as `sub` and the email, and expiring 12 hours after issue. Fails
        closed: a token that is present but malformed, tampered, expired, or
        a Capability Token gets 401 UNAUTHORIZED_TOKEN.

  parameters:
    SessionIdParam:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    RoundNumberParam:
      name: roundNumber
      in: path
      required: true
      schema:
        type: integer
        enum: [1, 2]

  responses:
    BadRequestError:
      description: >-
        INVALID_REQUEST_BODY. The body is not valid JSON, was sent without
        `Content-Type: application/json`, or is not a JSON object (an array,
        string, number or null). Checked for every route after the token, so a
        request without a valid token gets 401 first. The response never
        contains a stack trace.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    UnauthorizedError:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    ForbiddenError:
      description: Valid token does not have required role for this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    ConflictError:
      description: Operation conflicts with current state machine phase or lock
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    UnprocessableEntityError:
      description: Semantic or domain validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

  schemas:
    ApiErrorCode:
      type: string
      enum:
        - INVALID_REQUEST_BODY
        - UNAUTHORIZED_TOKEN
        - FORBIDDEN_ROLE
        - PACK_NOT_FOUND
        - SESSION_NOT_FOUND
        - ROOM_CODE_NOT_FOUND
        - CHAIN_NOT_FOUND
        - PACK_ALREADY_EXISTS
        - INVALID_PHASE_TRANSITION
        - PHASE_CLOSED_FOR_SUBMISSIONS
        - ADJUDICATION_LOCKED_BY_INSTRUCTOR
        - ASSESSMENT_ALREADY_SUBMITTED
        - PACK_VALIDATION_FAILED
        - CHAIN_TOPOLOGY_INVALID
        - ASSESSMENT_INCOMPLETE
        - CONCURRENT_UPDATE_CONFLICT
        - CHAIN_ALREADY_SUBMITTED
        - SURVEY_ALREADY_SUBMITTED
        - EMAIL_ALREADY_REGISTERED
        - INVALID_CREDENTIALS
        - ACCOUNT_TEMPORARILY_LOCKED
        - PACK_IS_SYSTEM_PACK
        - PACK_ALREADY_ARCHIVED
        - PACK_NOT_ARCHIVED
        - INTERNAL_ERROR

    ApiErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ApiErrorCode"
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    AccountCredentialsRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: rahman.s@aku.edu
        password:
          type: string
          minLength: 10
          maxLength: 1024

    AccountTokenResponse:
      type: object
      required: [accountId, email, accountToken, expiresAt]
      properties:
        accountId:
          type: string
        email:
          type: string
          description: The normalised (trimmed, lower-cased) email.
        accountToken:
          type: string
          description: >-
            Send as `Authorization: Bearer <accountToken>` where `AccountAuth`
            is required.
        expiresAt:
          type: string
          format: date-time
          description: 12 hours after issue.

    InstructorAccountView:
      type: object
      required: [accountId, email, createdAt]
      properties:
        accountId:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time

    BoardConfig:
      type: object
      required: [rows, cols, minChainLength, adjacencyRule]
      properties:
        rows:
          type: integer
          minimum: 3
          maximum: 12
          default: 7
        cols:
          type: integer
          minimum: 3
          maximum: 12
          default: 7
        minChainLength:
          type: integer
          minimum: 2
          default: 4
        adjacencyRule:
          type: string
          enum: [chebyshev-8, orthogonal-4]
          default: chebyshev-8

    SemanticDomain:
      type: object
      required: [id, label, description]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string

    KeywordCard:
      type: object
      required: [id, verbatimLabel, displayLabel, aliases, domainId, summary]
      properties:
        id:
          type: string
        verbatimLabel:
          type: string
        displayLabel:
          type: string
        aliases:
          type: array
          items:
            type: string
        domainId:
          type: string
        summary:
          type: string

    GridCoord:
      type: object
      required: [row, col]
      properties:
        row:
          type: integer
          minimum: 0
        col:
          type: integer
          minimum: 0

    CalibrationExample:
      type: object
      required: [id, title, path, keywordIds, narrativeExplanation, isValid]
      properties:
        id:
          type: string
        title:
          type: string
        path:
          type: array
          items:
            $ref: "#/components/schemas/GridCoord"
        keywordIds:
          type: array
          items:
            type: string
        narrativeExplanation:
          type: string
        isValid:
          type: boolean
        invalidReason:
          type: [string, "null"]

    AdjudicationRubric:
      type: object
      required: [evaluatorPersona, subjectDomain, chainContinuityCriteria, calibrationExamples]
      properties:
        evaluatorPersona:
          type: string
        subjectDomain:
          type: string
        chainContinuityCriteria:
          type: array
          minItems: 1
          items:
            type: string
        calibrationBoardCardIds:
          type: array
          description: Optional fixed 2D matrix of card IDs (e.g., Figure 2 of the Diabe-teach paper)
          items:
            type: array
            items:
              type: string
        calibrationExamples:
          type: array
          items:
            $ref: "#/components/schemas/CalibrationExample"

    PublicAssessmentQuestion:
      type: object
      required: [id, bloomLevel, stem, options, relatedKeywordIds]
      properties:
        id:
          type: string
        bloomLevel:
          type: integer
          enum: [2, 3]
        stem:
          type: string
        options:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: string
        relatedKeywordIds:
          type: array
          items:
            type: string
        correctIndex:
          type: integer
          minimum: 0
          maximum: 3
          description: Present only when requested with a valid instructorToken
        explanation:
          type: string
          description: Present only when requested with a valid instructorToken

    PerceptionSurveyItem:
      type: object
      required: [id, prompt]
      properties:
        id:
          type: string
        prompt:
          type: string

    CurriculumPackSummary:
      type: object
      required:
        - id
        - title
        - version
        - subjectDomain
        - boardConfig
        - cardCount
        - domainCount
        - hasAssessmentInstrument
        - hasPerceptionSurvey
      properties:
        id:
          type: string
        title:
          type: string
        version:
          type: string
        subjectDomain:
          type: string
        boardConfig:
          $ref: "#/components/schemas/BoardConfig"
        cardCount:
          type: integer
        domainCount:
          type: integer
        hasAssessmentInstrument:
          type: boolean
        hasPerceptionSurvey:
          type: boolean

    CurriculumPackListItem:
      description: >-
        A pack in the pack list: the summary of its latest Pack Version, who
        released that version, and whether the pack is archived.
      allOf:
        - $ref: "#/components/schemas/CurriculumPackSummary"
        - type: object
          required: [authorHandle, isArchived]
          properties:
            authorHandle:
              type: [string, "null"]
              description: >-
                The releasing account's email before the @ (for example
                `rahman.s`), or null when `createdBy` is not an Instructor
                Account. Never a full email address.
              examples: [rahman.s]
            isArchived:
              type: boolean
              description: True only when listed with `includeArchived=true`.

    PublicCurriculumPack:
      type: object
      required: [id, title, version, description, boardConfig, domains, cards, adjudicationRubric]
      properties:
        id:
          type: string
        title:
          type: string
        version:
          type: string
        description:
          type: string
        boardConfig:
          $ref: "#/components/schemas/BoardConfig"
        domains:
          type: array
          items:
            $ref: "#/components/schemas/SemanticDomain"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/KeywordCard"
        adjudicationRubric:
          $ref: "#/components/schemas/AdjudicationRubric"
        assessmentInstrument:
          type: [object, "null"]
          required: [questions]
          properties:
            questions:
              type: array
              items:
                $ref: "#/components/schemas/PublicAssessmentQuestion"
        perceptionSurvey:
          type: [object, "null"]
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PerceptionSurveyItem"

    CurriculumPackInput:
      allOf:
        - $ref: "#/components/schemas/PublicCurriculumPack"

    PackValidationIssue:
      type: object
      required: [jsonPointer, rule, message]
      properties:
        jsonPointer:
          type: string
        rule:
          type: string
          description: >-
            The rule that failed, for example REQUIRED_FIELD,
            INVALID_DOMAIN_REF, DIMENSION_MISMATCH, or INSUFFICIENT_CARDS
            (reported on `cards`: the pack has fewer Keyword Cards than its
            `rows × cols` board, so a Game Session could not deal a full
            board; the message states the shortfall).
        message:
          type: string

    SessionMode:
      type: string
      enum: [solo, classroom, study-rct]

    AdjudicationMode:
      type: string
      enum: [ai, peer-instructor, hybrid]

    PhaseIdentifier:
      type: string
      enum:
        - pretest
        - trial-orientation
        - round-1:chain-mapping
        - round-1:peer-adjudication
        - round-1:round-summary
        - round-2:chain-mapping
        - round-2:peer-adjudication
        - round-2:round-summary
        - posttest
        - feedback-survey
        - completed

    SessionTimerConfig:
      type: object
      additionalProperties: false
      description: >
        Phase durations in whole seconds (1 to 86400). Omitted fields use the default.
        Set a field to `null` to make that phase instructor-driven: it has no
        deadline (`phaseEndsAt` is `null`) and lasts until the instructor
        transitions it. An out-of-range duration or an unknown field is
        rejected with `INVALID_REQUEST_BODY`.
      properties:
        pretestSec:
          type: [integer, "null"]
          minimum: 1
          maximum: 86400
          default: 900
        trialOrientationSec:
          type: [integer, "null"]
          minimum: 1
          maximum: 86400
          default: 900
        roundMappingSec:
          type: [integer, "null"]
          minimum: 1
          maximum: 86400
          default: 1200
        roundAdjudicationSec:
          type: [integer, "null"]
          minimum: 1
          maximum: 86400
          default: 600
        posttestSec:
          type: [integer, "null"]
          minimum: 1
          maximum: 86400
          default: 900
        feedbackSurveySec:
          type: [integer, "null"]
          minimum: 1
          maximum: 86400
          default: 900

    CreateSessionRequest:
      type: object
      required: [packId, mode, adjudicationMode]
      properties:
        packId:
          type: string
          default: diabe-teach
        mode:
          $ref: "#/components/schemas/SessionMode"
        adjudicationMode:
          $ref: "#/components/schemas/AdjudicationMode"
        timerConfig:
          $ref: "#/components/schemas/SessionTimerConfig"
        seed:
          type: string
          minLength: 1
          description: >
            Seeds Round 1's board, which the server deals when the session
            enters `round-1:chain-mapping`. The same Curriculum Pack, board
            size and seed always give the same board. A `seed` sent with that
            transition overrides it. Without either, the server generates a
            random seed. Round 2 never uses this seed.
        creatorDisplayName:
          type: string

    CreateSessionResponse:
      type: object
      required: [sessionId, roomCode, instructorToken, state]
      properties:
        sessionId:
          type: string
        roomCode:
          type: string
        instructorToken:
          type: string
        participantId:
          type: [string, "null"]
          description: Auto-populated when mode is "solo"
        participantToken:
          type: [string, "null"]
          description: Auto-populated when mode is "solo"
        state:
          $ref: "#/components/schemas/PublicSessionState"

    JoinSessionRequest:
      type: object
      required: [roomCode]
      properties:
        roomCode:
          type: string
        displayName:
          type: string

    JoinSessionResponse:
      type: object
      required: [sessionId, participantId, participantToken, state]
      properties:
        sessionId:
          type: string
        participantId:
          type: string
        participantToken:
          type: string
        state:
          $ref: "#/components/schemas/PublicSessionState"

    BoardCellView:
      type: object
      required: [row, col, card]
      properties:
        row:
          type: integer
        col:
          type: integer
        card:
          $ref: "#/components/schemas/KeywordCard"

    BoardGridView:
      type: object
      description: >
        A Gameplay Round's board, dealt by the server from the session's
        Curriculum Pack when the round's Chain-Mapping phase starts.
        `cells[row][col]` holds a copy of the Keyword Card placed there.
      required: [seed, rows, cols, cells]
      properties:
        seed:
          type: string
          description: The seed this board was dealt with; it reproduces the board.
        rows:
          type: integer
        cols:
          type: integer
        cells:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/BoardCellView"

    PublicSessionState:
      type: object
      required:
        - sessionId
        - roomCode
        - packId
        - mode
        - adjudicationMode
        - currentPhase
        - phaseStartedAt
        - phaseEndsAt
        - participantCount
        - activeBoard
      properties:
        sessionId:
          type: string
        roomCode:
          type: string
        packId:
          type: string
        packVersion:
          type: [string, "null"]
          description: >
            The Pack Version the session started with (the latest version
            when it was created). The board deal, Pretest, Posttest and
            perception survey all read this version, even after a newer one
            is registered. `null` for sessions stored before versions were
            pinned, which read the pack's latest version.
        mode:
          $ref: "#/components/schemas/SessionMode"
        adjudicationMode:
          $ref: "#/components/schemas/AdjudicationMode"
        currentPhase:
          $ref: "#/components/schemas/PhaseIdentifier"
        activeRoundNumber:
          type: [integer, "null"]
          enum: [1, 2, null]
        phaseStartedAt:
          type: string
          format: date-time
        phaseEndsAt:
          type: [string, "null"]
          format: date-time
          description: >
            When the current phase is scheduled to end. `null` when the
            phase is instructor-driven (its timer is set to `null`).
        activeBoard:
          description: >
            The board of the active Gameplay Round, the same through its
            Chain-Mapping, Peer-Adjudication and Round-Summary phases. `null`
            outside a Gameplay Round (pretest, trial orientation, posttest,
            feedback survey, completed), and for a round entered before the
            server dealt boards.
          oneOf:
            - $ref: "#/components/schemas/BoardGridView"
            - type: "null"
        participantCount:
          type: integer

    TransitionPhaseRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [advance, jump]
          default: advance
        targetPhase:
          $ref: "#/components/schemas/PhaseIdentifier"
        seed:
          type: string
          minLength: 1
          description: >
            Seeds the board of the round this transition enters
            (`round-1:chain-mapping` or `round-2:chain-mapping`), overriding
            the session's creation seed for Round 1. Without it, Round 1 uses
            the creation seed and otherwise the server generates a random
            seed. Ignored for transitions that enter no round.

    StepRationale:
      type: object
      required: [fromCoord, toCoord, rationale]
      properties:
        fromCoord:
          $ref: "#/components/schemas/GridCoord"
        toCoord:
          $ref: "#/components/schemas/GridCoord"
        rationale:
          type: string

    SubmitChainRequest:
      type: object
      required: [path, narrativeExplanation]
      properties:
        path:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/GridCoord"
        narrativeExplanation:
          type: string
          minLength: 1
        stepRationales:
          type: array
          items:
            $ref: "#/components/schemas/StepRationale"

    TransitionEvaluation:
      type: object
      required: [fromKeywordId, toKeywordId, isSound, commentary]
      properties:
        fromKeywordId:
          type: string
        toKeywordId:
          type: string
        isSound:
          type: boolean
        commentary:
          type: string

    AdjudicationVerdict:
      type: object
      required:
        - isApproved
        - adjudicatorType
        - isLocked
        - qualityScore
        - transitionEvaluations
        - overallFeedback
      properties:
        isApproved:
          type: boolean
        adjudicatorType:
          type: string
          enum: [ai-specialist, peer-consensus, instructor-final]
        isLocked:
          type: boolean
        qualityScore:
          type: number
          minimum: 1
          maximum: 10
        transitionEvaluations:
          type: array
          items:
            $ref: "#/components/schemas/TransitionEvaluation"
        overallFeedback:
          type: string
        suggestedRefinements:
          type: [string, "null"]

    PeerVoteRecord:
      type: object
      required: [voterParticipantId, decision, votedAt]
      properties:
        voterParticipantId:
          type: string
        decision:
          type: string
          enum: [approve, challenge]
        comment:
          type: [string, "null"]
        votedAt:
          type: string
          format: date-time

    SubmittedChain:
      type: object
      required:
        - chainId
        - sessionId
        - roundNumber
        - participantId
        - path
        - keywordIds
        - narrativeExplanation
        - status
        - peerVotes
        - submittedAt
      properties:
        chainId:
          type: string
        sessionId:
          type: string
        roundNumber:
          type: integer
          enum: [1, 2]
        participantId:
          type: string
        path:
          type: array
          items:
            $ref: "#/components/schemas/GridCoord"
        keywordIds:
          type: array
          items:
            type: string
        narrativeExplanation:
          type: string
        stepRationales:
          type: array
          items:
            $ref: "#/components/schemas/StepRationale"
        status:
          type: string
          enum: [pending-review, approved, rejected]
        verdict:
          oneOf:
            - $ref: "#/components/schemas/AdjudicationVerdict"
            - type: "null"
        peerVotes:
          type: array
          items:
            $ref: "#/components/schemas/PeerVoteRecord"
        submittedAt:
          type: string
          format: date-time

    AdjudicateChainRequest:
      oneOf:
        - $ref: "#/components/schemas/PeerVoteActionRequest"
        - $ref: "#/components/schemas/AiEvaluateActionRequest"
        - $ref: "#/components/schemas/InstructorRulingActionRequest"
      discriminator:
        propertyName: action
        mapping:
          peer-approve: "#/components/schemas/PeerVoteActionRequest"
          peer-challenge: "#/components/schemas/PeerVoteActionRequest"
          ai-evaluate: "#/components/schemas/AiEvaluateActionRequest"
          instructor-approve: "#/components/schemas/InstructorRulingActionRequest"
          instructor-reject: "#/components/schemas/InstructorRulingActionRequest"

    PeerVoteActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [peer-approve, peer-challenge]
        comment:
          type: string

    AiEvaluateActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          const: ai-evaluate

    InstructorRulingActionRequest:
      type: object
      required: [action, feedback]
      properties:
        action:
          type: string
          enum: [instructor-approve, instructor-reject]
        feedback:
          type: string
          minLength: 1
        qualityScore:
          type: number
          minimum: 1
          maximum: 10

    PlayerRoundStanding:
      type: object
      required:
        - rank
        - participantId
        - longestValidChainLength
        - totalValidChainsCount
        - cumulativeRationaleScore
        - approvedChainIds
      properties:
        rank:
          type: integer
          minimum: 1
        participantId:
          type: string
        displayName:
          type: [string, "null"]
        longestValidChainLength:
          type: integer
          minimum: 0
        totalValidChainsCount:
          type: integer
          minimum: 0
        cumulativeRationaleScore:
          type: number
          minimum: 0
        approvedChainIds:
          type: array
          items:
            type: string

    McqAnswerChoice:
      oneOf:
        - type: integer
          enum: [0, 1, 2, 3]
        - type: string
          const: I_DONT_KNOW

    SubmitAssessmentRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/McqAnswerChoice"

    AssessmentStageSummary:
      type: object
      required:
        - stage
        - totalQuestions
        - correctCount
        - wrongGuessCount
        - iDontKnowCount
        - correctPercentage
        - wrongGuessPercentage
        - iDontKnowPercentage
        - uncertaintyCalibrationRatio
      properties:
        stage:
          type: string
          enum: [pretest, posttest]
        totalQuestions:
          type: integer
        correctCount:
          type: integer
        wrongGuessCount:
          type: integer
        iDontKnowCount:
          type: integer
        correctPercentage:
          type: number
        wrongGuessPercentage:
          type: number
        iDontKnowPercentage:
          type: number
        uncertaintyCalibrationRatio:
          type: number
          description: iDontKnowCount / (iDontKnowCount + wrongGuessCount), or 1.0 when both are 0

    LearnerMetacognitiveReport:
      type: object
      required:
        - participantId
        - chainDiversityIndex
        - neglectedKeywordIds
      properties:
        participantId:
          type: string
        pretest:
          oneOf:
            - $ref: "#/components/schemas/AssessmentStageSummary"
            - type: "null"
        posttest:
          oneOf:
            - $ref: "#/components/schemas/AssessmentStageSummary"
            - type: "null"
        knowledgeGainDelta:
          type: [number, "null"]
        guessingReductionDelta:
          type: [number, "null"]
        chainDiversityIndex:
          type: number
          minimum: 0
          maximum: 1
        neglectedKeywordIds:
          type: array
          items:
            type: string

    QuestionReviewItem:
      type: object
      required: [questionId, stem, options, correctIndex, pretestChoice, posttestChoice]
      properties:
        questionId:
          type: string
        stem:
          type: string
        options:
          type: array
          items:
            type: string
        correctIndex:
          type: integer
        explanation:
          type: [string, "null"]
        pretestChoice:
          oneOf:
            - $ref: "#/components/schemas/McqAnswerChoice"
            - type: "null"
        posttestChoice:
          $ref: "#/components/schemas/McqAnswerChoice"

    AssessmentSubmissionResponse:
      oneOf:
        - $ref: "#/components/schemas/PretestSubmissionReceipt"
        - $ref: "#/components/schemas/PosttestSubmissionResult"
      discriminator:
        propertyName: stage
        mapping:
          pretest: "#/components/schemas/PretestSubmissionReceipt"
          posttest: "#/components/schemas/PosttestSubmissionResult"

    PretestSubmissionReceipt:
      type: object
      required: [stage, participantId, recordedCount, submittedAt]
      properties:
        stage:
          type: string
          const: pretest
        participantId:
          type: string
        recordedCount:
          type: integer
        submittedAt:
          type: string
          format: date-time

    PosttestSubmissionResult:
      type: object
      required: [stage, participantId, submittedAt, report, answerKeyReview]
      properties:
        stage:
          type: string
          const: posttest
        participantId:
          type: string
        submittedAt:
          type: string
          format: date-time
        report:
          $ref: "#/components/schemas/LearnerMetacognitiveReport"
        answerKeyReview:
          type: array
          items:
            $ref: "#/components/schemas/QuestionReviewItem"

    SubmitSurveyRequest:
      type: object
      required: [responses]
      properties:
        responses:
          type: object
          additionalProperties:
            type: integer
            enum: [1, 2, 3, 4, 5]
        comments:
          type: string

    CohortAnalyticsReport:
      type: object
      required:
        - sessionId
        - participantCount
        - pretestCohortMeanPercentage
        - posttestCohortMeanPercentage
        - posttestWrongGuessMeanPercentage
        - posttestIDontKnowMeanPercentage
        - meanChainDiversityIndex
        - boardNeglectHeatmap
      properties:
        sessionId:
          type: string
        participantCount:
          type: integer
        pretestCohortMeanPercentage:
          type: [number, "null"]
        posttestCohortMeanPercentage:
          type: [number, "null"]
        posttestWrongGuessMeanPercentage:
          type: [number, "null"]
        posttestIDontKnowMeanPercentage:
          type: [number, "null"]
        meanChainDiversityIndex:
          type: number
        boardNeglectHeatmap:
          type: array
          description: 2D matrix of usage frequencies per (row, col) cell
          items:
            type: array
            items:
              type: number

    SessionAnalyticsResponse:
      type: object
      required: [role, cohortSummary]
      properties:
        role:
          type: string
          enum: [participant, instructor]
        participantReport:
          oneOf:
            - $ref: "#/components/schemas/LearnerMetacognitiveReport"
            - type: "null"
        cohortSummary:
          $ref: "#/components/schemas/CohortAnalyticsReport"

    SseEventEnvelope:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          enum:
            - session.snapshot
            - participant.joined
            - phase.changed
            - chain.submitted
            - chain.adjudicated
            - standings.updated
        data:
          type: object
          additionalProperties: true
