    <script>
        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: Diabe-teach Concept-Chain API\nconfig:\n  environments:\n    - name: Local Dev\n      variables:\n        - name: baseUrl\n          value: http://localhost:8888\n        - name: apiKey\n          value: dev-local-api-key\n        - name: teacherEmail\n          value: rahman.s@aku.edu\n        - name: teacherPassword\n          value: correct horse battery\n        - name: packId\n          value: diabe-teach\n        - name: customPackId\n          value: endocrine-intro\n        - name: roundNumber\n          value: '1'\n        - name: assessmentStage\n          value: pretest\n        - name: accountId\n          value: ''\n        - name: accountToken\n          value: ''\n        - name: sessionId\n          value: ''\n        - name: roomCode\n          value: ''\n        - name: instructorToken\n          value: ''\n        - name: participantId\n          value: ''\n        - name: participantToken\n          value: ''\n        - name: chainId\n          value: ''\n    - name: Netlify Production\n      variables:\n        - name: baseUrl\n          value: https://diabe-teach.netlify.app\n        - name: teacherEmail\n          value: rahman.s@aku.edu\n        - name: packId\n          value: diabe-teach\n        - name: customPackId\n          value: endocrine-intro\n        - name: roundNumber\n          value: '1'\n        - name: assessmentStage\n          value: pretest\n        - name: accountId\n          value: ''\n        - name: sessionId\n          value: ''\n        - name: roomCode\n          value: ''\n        - name: participantId\n          value: ''\n        - name: chainId\n          value: ''\n        - name: apiKey\n          secret: true\n        - name: teacherPassword\n          secret: true\n        - name: accountToken\n          secret: true\n        - name: instructorToken\n          secret: true\n        - name: participantToken\n          secret: true\nitems:\n  - info:\n      name: 01-Health\n      type: folder\n      seq: 1\n    docs:\n      content: |-\n        # Health Check\n\n        Readiness probe used by `npm run dev:local` and the sequential BDD runner to verify that the Netlify Functions v2 runtime is up and responding on port `8888`.\n      type: text/markdown\n    items:\n      - info:\n          name: Health Check\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/health'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"returns 200 ok\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.status).to.equal(\"ok\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # GET /api/health\n\n          Lightweight liveness/readiness endpoint that requires no authentication and returns `{ \"status\": \"ok\" }`.\n\n          ## Responses\n          - **`200 OK`**: `{ \"status\": \"ok\" }`\n  - info:\n      name: 02-Instructor-Accounts\n      type: folder\n      seq: 2\n    docs:\n      content: |-\n        # Instructor Accounts & Account Tokens\n\n        Manages persistent **Instructor Accounts** (identified by a normalized email and an Argon2id password hash, per ADR-0007).\n\n        Signing up or signing in issues a 12-hour **Account Token** (`kind: \"account\"`), which is automatically saved into `{{accountToken}}` and `{{accountId}}` for use on Curriculum Pack management routes and Classroom Game creation.\n      type: text/markdown\n    items:\n      - info:\n          name: Sign Up Instructor\n          type: http\n          seq: 1\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/accounts/sign-up'\n          body:\n            type: json\n            data: |-\n              {\n                \"email\": \"{{teacherEmail}}\",\n                \"password\": \"{{teacherPassword}}\"\n              }\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                if (res.status === 201 && res.body) {\n                  bru.setEnvVar(\"accountToken\", res.body.accountToken);\n                  bru.setEnvVar(\"accountId\", res.body.accountId);\n                }\n            - type: tests\n              code: |-\n                test(\"creates an Instructor Account (201) or reports already registered (409)\", function() {\n                  expect([201, 409]).to.include(res.status);\n                  if (res.status === 201) {\n                    expect(res.body.accountToken).to.be.a(\"string\");\n                    expect(res.body.accountId).to.be.a(\"string\");\n                  } else {\n                    expect(res.body.code).to.equal(\"EMAIL_ALREADY_REGISTERED\");\n                  }\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # POST /api/v1/accounts/sign-up (`signUpInstructor`)\n\n          Registers a new **Instructor Account** with an email (trimmed and lower-cased) and a password (at least 10 characters, hashed with Argon2id) and immediately signs it in, returning a 12-hour **Account Token**.\n\n          ## Automatic Variable Chaining\n          On `201 Created`, `script:post-response` saves:\n          - `{{accountToken}}`\n          - `{{accountId}}`\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`201 Created`**: `{ accountId, email, accountToken, expiresAt }`\n          - **`400 INVALID_REQUEST_BODY`**: Malformed JSON, invalid email format (`details.field: \"email\"`), or password under 10 characters (`details.field: \"password\"`).\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing or invalid `x-api-key` when API key enforcement is active.\n          - **`409 EMAIL_ALREADY_REGISTERED`**: An Instructor Account already exists for the normalized email.\n          - **`413 PAYLOAD_TOO_LARGE`**: Request body exceeds 256 KB.\n      - info:\n          name: Sign In Instructor\n          type: http\n          seq: 2\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/accounts/sign-in'\n          body:\n            type: json\n            data: |-\n              {\n                \"email\": \"{{teacherEmail}}\",\n                \"password\": \"{{teacherPassword}}\"\n              }\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                if (res.status === 200 && res.body) {\n                  bru.setEnvVar(\"accountToken\", res.body.accountToken);\n                  bru.setEnvVar(\"accountId\", res.body.accountId);\n                }\n            - type: tests\n              code: |-\n                test(\"signs in an existing Instructor Account and issues an Account Token\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.accountToken).to.be.a(\"string\");\n                  expect(res.body.accountId).to.be.a(\"string\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # POST /api/v1/accounts/sign-in (`signInInstructor`)\n\n          Verifies an **Instructor Account**'s email and password and issues a fresh 12-hour **Account Token**. Five consecutive wrong-password attempts lock the account for 15 minutes (`423 ACCOUNT_TEMPORARILY_LOCKED`).\n\n          ## Automatic Variable Chaining\n          On `200 OK`, `script:post-response` saves:\n          - `{{accountToken}}`\n          - `{{accountId}}`\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: `{ accountId, email, accountToken, expiresAt }`\n          - **`400 INVALID_REQUEST_BODY`**: Non-object JSON body or non-string field.\n          - **`401 INVALID_CREDENTIALS`**: Unknown email, wrong password, or missing email/password field (identical generic message to prevent account enumeration).\n          - **`413 PAYLOAD_TOO_LARGE`**: Request body exceeds 256 KB.\n          - **`423 ACCOUNT_TEMPORARILY_LOCKED`**: Account locked after 5 wrong-password attempts (`details.lockedUntil`).\n      - info:\n          name: Get Current Instructor Account\n          type: http\n          seq: 3\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/v1/accounts/me'\n          auth:\n            type: bearer\n            token: '{{accountToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"returns the signed-in Instructor Account profile\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.accountId).to.be.a(\"string\");\n                  expect(res.body.email).to.be.a(\"string\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # GET /api/v1/accounts/me (`getCurrentInstructorAccount`)\n\n          Returns the **Instructor Account** (`accountId`, normalized `email`, `createdAt`) associated with the caller's **Account Token** (`AccountAuth`).\n\n          ## Authentication\n          - **`AccountAuth`**: `Authorization: Bearer {{accountToken}}`\n          - Session **Capability Tokens** (`{{instructorToken}}`, `{{participantToken}}`) are refused with `401 UNAUTHORIZED_TOKEN` (ADR-0007).\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: `{ accountId, email, createdAt }`\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing, expired, tampered, or wrong-kind bearer token.\n  - info:\n      name: 03-Curriculum-Packs\n      type: folder\n      seq: 3\n    docs:\n      content: |-\n        # Shared Curriculum Pack Library\n\n        Discovery, dry-run validation, registration, new **Pack Version** publishing, **Pack Archive**, and unarchiving for **Curriculum Packs** (ADR-0006, ADR-0007).\n\n        - Discovery (`GET /api/v1/packs`, `GET /api/v1/packs/:packId`) requires only `x-api-key`.\n        - Write operations (`validate`, `register`, `archive`, `unarchive`) require a teacher's **Account Token** (`{{accountToken}}`).\n        - Built-in **System Packs** (`diabe-teach`) cannot be archived or overwritten (`403 PACK_IS_SYSTEM_PACK`).\n      type: text/markdown\n    items:\n      - info:\n          name: List Curriculum Packs\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/v1/packs'\n          params:\n            - name: includeArchived\n              value: 'true'\n              type: query\n              disabled: true\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"lists available Curriculum Packs including diabe-teach\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.packs).to.be.an(\"array\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # GET /api/v1/packs (`listCurriculumPacks`)\n\n          Lists the latest **Pack Version** of each unarchived **Curriculum Pack** in the shared library (`packId`, `title`, `version`, `description`, `cardCount`, `domainCount`, `isSystemPack`, `isArchived`, `authorName`, `authorHandle`).\n\n          ## Query Parameters\n          - `includeArchived` *(optional, boolean)*: Enable `includeArchived=true` in the Params tab to also include archived Curriculum Packs.\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: `{ packs: CurriculumPackListItem[] }`\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing or invalid `x-api-key`.\n      - info:\n          name: Get Curriculum Pack By ID\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/v1/packs/{{packId}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"returns the full Curriculum Pack definition\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.pack.id).to.be.a(\"string\");\n                  expect(res.body.pack.cards).to.be.an(\"array\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # GET /api/v1/packs/:packId (`getCurriculumPackById`)\n\n          Retrieves the latest **Pack Version** of a **Curriculum Pack** by its `packId` (defaults to `{{packId}}` = `diabe-teach`), including its `boardConfig`, **Semantic Domains**, **Keyword Cards**, **Adjudication Rubric**, assessment instrument, and perception survey.\n\n          - Without an instructor **Capability Token**, MCQ `correctOptionIndex` and `explanation` fields are redacted (`null`) so learners cannot inspect the answer key.\n          - With `Authorization: Bearer {{instructorToken}}`, the unredacted answer key is included.\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: Full `CurriculumPack` object.\n          - **`401 UNAUTHORIZED_TOKEN`**: Invalid or wrong-kind bearer token when an `Authorization` header is supplied.\n          - **`404 PACK_NOT_FOUND`**: No Curriculum Pack exists with `packId`.\n      - info:\n          name: Validate Curriculum Pack\n          type: http\n          seq: 3\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/packs/validate'\n          body:\n            type: json\n            data: |-\n              {\n                \"id\": \"{{customPackId}}\",\n                \"title\": \"Endocrine Pathophysiology Intro\",\n                \"version\": \"1.0.0\",\n                \"description\": \"A 3x3 introductory curriculum pack covering endocrine feedback loops and glucose regulation.\",\n                \"authorName\": \"Dr. S. Rahman\",\n                \"boardConfig\": {\n                  \"rows\": 3,\n                  \"cols\": 3,\n                  \"minChainLength\": 3,\n                  \"adjacencyRule\": \"chebyshev-8\"\n                },\n                \"domains\": [\n                  {\n                    \"id\": \"hormones\",\n                    \"label\": \"Hormones & Signaling\",\n                    \"description\": \"Endocrine hormones and receptor pathways\"\n                  },\n                  {\n                    \"id\": \"metabolism\",\n                    \"label\": \"Glucose Metabolism\",\n                    \"description\": \"Hepatic and peripheral glucose uptake\"\n                  }\n                ],\n                \"cards\": [\n                  {\n                    \"id\": \"card-insulin\",\n                    \"verbatimLabel\": \"Insulin\",\n                    \"displayLabel\": \"Insulin\",\n                    \"aliases\": [],\n                    \"domainId\": \"hormones\",\n                    \"summary\": \"Anabolic peptide hormone secreted by pancreatic beta cells.\"\n                  },\n                  {\n                    \"id\": \"card-glucagon\",\n                    \"verbatimLabel\": \"Glucagon\",\n                    \"displayLabel\": \"Glucagon\",\n                    \"aliases\": [],\n                    \"domainId\": \"hormones\",\n                    \"summary\": \"Counter-regulatory hormone secreted by pancreatic alpha cells.\"\n                  },\n                  {\n                    \"id\": \"card-beta-cell\",\n                    \"verbatimLabel\": \"Pancreatic Beta Cell\",\n                    \"displayLabel\": \"Beta Cell\",\n                    \"aliases\": [],\n                    \"domainId\": \"hormones\",\n                    \"summary\": \"Endocrine islet cell that senses glucose and releases insulin.\"\n                  },\n                  {\n                    \"id\": \"card-glut4\",\n                    \"verbatimLabel\": \"GLUT4 Transporter\",\n                    \"displayLabel\": \"GLUT4\",\n                    \"aliases\": [],\n                    \"domainId\": \"metabolism\",\n                    \"summary\": \"Insulin-regulated glucose transporter in skeletal muscle and adipose tissue.\"\n                  },\n                  {\n                    \"id\": \"card-glycogenolysis\",\n                    \"verbatimLabel\": \"Hepatic Glycogenolysis\",\n                    \"displayLabel\": \"Glycogenolysis\",\n                    \"aliases\": [],\n                    \"domainId\": \"metabolism\",\n                    \"summary\": \"Breakdown of stored hepatic glycogen into glucose.\"\n                  },\n                  {\n                    \"id\": \"card-gluconeogenesis\",\n                    \"verbatimLabel\": \"Hepatic Gluconeogenesis\",\n                    \"displayLabel\": \"Gluconeogenesis\",\n                    \"aliases\": [],\n                    \"domainId\": \"metabolism\",\n                    \"summary\": \"Synthesis of glucose from non-carbohydrate precursors in the liver.\"\n                  },\n                  {\n                    \"id\": \"card-hyperglycemia\",\n                    \"verbatimLabel\": \"Hyperglycemia\",\n                    \"displayLabel\": \"Hyperglycemia\",\n                    \"aliases\": [],\n                    \"domainId\": \"metabolism\",\n                    \"summary\": \"Elevated blood glucose concentration due to relative or absolute insulin deficiency.\"\n                  },\n                  {\n                    \"id\": \"card-insulin-receptor\",\n                    \"verbatimLabel\": \"Insulin Receptor Tyrosine Kinase\",\n                    \"displayLabel\": \"Insulin Receptor\",\n                    \"aliases\": [],\n                    \"domainId\": \"hormones\",\n                    \"summary\": \"Transmembrane receptor activated by insulin binding.\"\n                  },\n                  {\n                    \"id\": \"card-ampk\",\n                    \"verbatimLabel\": \"AMP-Activated Protein Kinase\",\n                    \"displayLabel\": \"AMPK\",\n                    \"aliases\": [],\n                    \"domainId\": \"metabolism\",\n                    \"summary\": \"Cellular energy sensor that stimulates glucose uptake and fatty acid oxidation.\"\n                  }\n                ],\n                \"adjudicationRubric\": {\n                  \"evaluatorPersona\": \"Academic endocrinologist evaluating mechanistic concept chains\",\n                  \"subjectDomain\": \"Endocrinology and Glucose Homeostasis\",\n                  \"chainContinuityCriteria\": [\n                    \"Each consecutive pair of Keyword Cards must have a direct physiological or biochemical causal link.\"\n                  ],\n                  \"calibrationExamples\": []\n                },\n                \"assessmentInstrument\": null,\n                \"perceptionSurvey\": null\n              }\n          auth:\n            type: bearer\n            token: '{{accountToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"dry-run validates the Curriculum Pack and returns valid: true\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.valid).to.equal(true);\n                  expect(res.body.errors).to.be.an(\"array\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # POST /api/v1/packs/validate (`validateCurriculumPack`)\n\n          Performs a dry-run validation of a draft **Curriculum Pack** without persisting it, checking semantic domain references, board capacity (`cards.length >= rows * cols`), calibration examples, and optional assessment/survey instruments.\n\n          ## Authentication\n          - **`AccountAuth`**: `Authorization: Bearer {{accountToken}}`\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: `{ valid: boolean, errors: ValidationError[], warnings: ValidationWarning[] }`\n          - **`400 INVALID_REQUEST_BODY`**: Missing required top-level schema field or wrong property type.\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing, invalid, or non-Account bearer token.\n          - **`413 PAYLOAD_TOO_LARGE`**: Request body exceeds 256 KB.\n      - info:\n          name: Register Curriculum Pack\n          type: http\n          seq: 4\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/packs'\n          body:\n            type: json\n            data: |-\n              {\n                \"id\": \"{{customPackId}}\",\n                \"title\": \"Endocrine Pathophysiology Intro\",\n                \"version\": \"1.0.0\",\n                \"description\": \"A 3x3 introductory curriculum pack covering endocrine feedback loops and glucose regulation.\",\n                \"authorName\": \"Dr. S. Rahman\",\n                \"boardConfig\": {\n                  \"rows\": 3,\n                  \"cols\": 3,\n                  \"minChainLength\": 3,\n                  \"adjacencyRule\": \"chebyshev-8\"\n                },\n                \"domains\": [\n                  {\n                    \"id\": \"hormones\",\n                    \"label\": \"Hormones & Signaling\",\n                    \"description\": \"Endocrine hormones and receptor pathways\"\n                  },\n                  {\n                    \"id\": \"metabolism\",\n                    \"label\": \"Glucose Metabolism\",\n                    \"description\": \"Hepatic and peripheral glucose uptake\"\n                  }\n                ],\n                \"cards\": [\n                  {\n                    \"id\": \"card-insulin\",\n                    \"verbatimLabel\": \"Insulin\",\n                    \"displayLabel\": \"Insulin\",\n                    \"aliases\": [],\n                    \"domainId\": \"hormones\",\n                    \"summary\": \"Anabolic peptide hormone secreted by pancreatic beta cells.\"\n                  },\n                  {\n                    \"id\": \"card-glucagon\",\n                    \"verbatimLabel\": \"Glucagon\",\n                    \"displayLabel\": \"Glucagon\",\n                    \"aliases\": [],\n                    \"domainId\": \"hormones\",\n                    \"summary\": \"Counter-regulatory hormone secreted by pancreatic alpha cells.\"\n                  },\n                  {\n                    \"id\": \"card-beta-cell\",\n                    \"verbatimLabel\": \"Pancreatic Beta Cell\",\n                    \"displayLabel\": \"Beta Cell\",\n                    \"aliases\": [],\n                    \"domainId\": \"hormones\",\n                    \"summary\": \"Endocrine islet cell that senses glucose and releases insulin.\"\n                  },\n                  {\n                    \"id\": \"card-glut4\",\n                    \"verbatimLabel\": \"GLUT4 Transporter\",\n                    \"displayLabel\": \"GLUT4\",\n                    \"aliases\": [],\n                    \"domainId\": \"metabolism\",\n                    \"summary\": \"Insulin-regulated glucose transporter in skeletal muscle and adipose tissue.\"\n                  },\n                  {\n                    \"id\": \"card-glycogenolysis\",\n                    \"verbatimLabel\": \"Hepatic Glycogenolysis\",\n                    \"displayLabel\": \"Glycogenolysis\",\n                    \"aliases\": [],\n                    \"domainId\": \"metabolism\",\n                    \"summary\": \"Breakdown of stored hepatic glycogen into glucose.\"\n                  },\n                  {\n                    \"id\": \"card-gluconeogenesis\",\n                    \"verbatimLabel\": \"Hepatic Gluconeogenesis\",\n                    \"displayLabel\": \"Gluconeogenesis\",\n                    \"aliases\": [],\n                    \"domainId\": \"metabolism\",\n                    \"summary\": \"Synthesis of glucose from non-carbohydrate precursors in the liver.\"\n                  },\n                  {\n                    \"id\": \"card-hyperglycemia\",\n                    \"verbatimLabel\": \"Hyperglycemia\",\n                    \"displayLabel\": \"Hyperglycemia\",\n                    \"aliases\": [],\n                    \"domainId\": \"metabolism\",\n                    \"summary\": \"Elevated blood glucose concentration due to relative or absolute insulin deficiency.\"\n                  },\n                  {\n                    \"id\": \"card-insulin-receptor\",\n                    \"verbatimLabel\": \"Insulin Receptor Tyrosine Kinase\",\n                    \"displayLabel\": \"Insulin Receptor\",\n                    \"aliases\": [],\n                    \"domainId\": \"hormones\",\n                    \"summary\": \"Transmembrane receptor activated by insulin binding.\"\n                  },\n                  {\n                    \"id\": \"card-ampk\",\n                    \"verbatimLabel\": \"AMP-Activated Protein Kinase\",\n                    \"displayLabel\": \"AMPK\",\n                    \"aliases\": [],\n                    \"domainId\": \"metabolism\",\n                    \"summary\": \"Cellular energy sensor that stimulates glucose uptake and fatty acid oxidation.\"\n                  }\n                ],\n                \"adjudicationRubric\": {\n                  \"evaluatorPersona\": \"Academic endocrinologist evaluating mechanistic concept chains\",\n                  \"subjectDomain\": \"Endocrinology and Glucose Homeostasis\",\n                  \"chainContinuityCriteria\": [\n                    \"Each consecutive pair of Keyword Cards must have a direct physiological or biochemical causal link.\"\n                  ],\n                  \"calibrationExamples\": []\n                },\n                \"assessmentInstrument\": null,\n                \"perceptionSurvey\": null\n              }\n          auth:\n            type: bearer\n            token: '{{accountToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"registers the Curriculum Pack version (201) or reports already registered (409)\", function() {\n                  expect([201, 409]).to.include(res.status);\n                  if (res.status === 201) {\n                    expect(res.body.packId).to.be.a(\"string\");\n                    expect(res.body.version).to.equal(\"1.0.0\");\n                  } else {\n                    expect(res.body.code).to.equal(\"PACK_ALREADY_EXISTS\");\n                  }\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # POST /api/v1/packs (`registerCurriculumPack`)\n\n          Publishes a new **Curriculum Pack** or a new immutable **Pack Version** (`id` + `version`) to the shared library, recording the signed-in teacher's `accountId` as `createdBy`.\n\n          ## Authentication\n          - **`AccountAuth`**: `Authorization: Bearer {{accountToken}}`\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`201 Created`**: `{ packId, version, warnings }`\n          - **`400 INVALID_REQUEST_BODY`**: Schema violation on required pack fields.\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing, invalid, or non-Account bearer token.\n          - **`403 PACK_IS_SYSTEM_PACK`**: Attempting to release a new version of a System Pack (`diabe-teach`).\n          - **`409 PACK_ALREADY_EXISTS`**: The `id@version` snapshot already exists.\n          - **`413 PAYLOAD_TOO_LARGE`**: Request body exceeds 256 KB.\n          - **`422 PACK_VALIDATION_FAILED`**: Semantic or board-capacity validation errors (`details.errors`).\n      - info:\n          name: Archive Curriculum Pack\n          type: http\n          seq: 5\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/packs/{{customPackId}}/archive'\n          auth:\n            type: bearer\n            token: '{{accountToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"archives the custom Curriculum Pack\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.isArchived).to.equal(true);\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # POST /api/v1/packs/:packId/archive (`archiveCurriculumPack`)\n\n          Performs a **Pack Archive** soft-removal of the latest **Pack Version** of `:packId` (`{{customPackId}}`), hiding it from default `GET /api/v1/packs` listings while keeping it accessible for existing Game Sessions and direct lookups.\n\n          ## Authentication\n          - **`AccountAuth`**: `Authorization: Bearer {{accountToken}}`\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: `{ packId, isArchived: true, archivedAt, archivedBy }`\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing, invalid, or non-Account bearer token.\n          - **`403 PACK_IS_SYSTEM_PACK`**: System Packs (`diabe-teach`) cannot be archived.\n          - **`404 PACK_NOT_FOUND`**: Unknown `packId`.\n          - **`409 PACK_ALREADY_ARCHIVED`**: The pack is already archived.\n      - info:\n          name: Unarchive Curriculum Pack\n          type: http\n          seq: 6\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/packs/{{customPackId}}/unarchive'\n          auth:\n            type: bearer\n            token: '{{accountToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"unarchives the custom Curriculum Pack\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.isArchived).to.equal(false);\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # POST /api/v1/packs/:packId/unarchive (`unarchiveCurriculumPack`)\n\n          Restores an archived **Curriculum Pack** (`{{customPackId}}`) back to active discovery in `GET /api/v1/packs`, recording `unarchivedBy` and `unarchivedAt`.\n\n          ## Authentication\n          - **`AccountAuth`**: `Authorization: Bearer {{accountToken}}`\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: `{ packId, isArchived: false, unarchivedAt, unarchivedBy }`\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing, invalid, or non-Account bearer token.\n          - **`404 PACK_NOT_FOUND`**: Unknown `packId`.\n          - **`409 PACK_NOT_ARCHIVED`**: The pack is not currently archived.\n  - info:\n      name: 04-Game-Sessions\n      type: folder\n      seq: 4\n    docs:\n      content: |-\n        # Game Sessions & Phase Controls\n\n        Creates a **Game Session** (Solo Practice, Classroom Game, or Study RCT), joins a learner via the 6-character `roomCode`, reads session state (`activeBoard`, `participants`, `phaseEndsAt`), transitions phases, and extends timed phases.\n\n        - `POST /api/v1/sessions` in `classroom` or `study-rct` mode requires a teacher's **Account Token** (`{{accountToken}}`) and issues the session-scoped `{{instructorToken}}` (**Capability Token**).\n        - `POST /api/v1/sessions/join` issues the learner's session-scoped `{{participantToken}}` (**Capability Token**).\n      type: text/markdown\n    items:\n      - info:\n          name: Create Game Session\n          type: http\n          seq: 1\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/sessions'\n          body:\n            type: json\n            data: |-\n              {\n                \"packId\": \"{{packId}}\",\n                \"mode\": \"classroom\",\n                \"adjudicationMode\": \"peer-instructor\",\n                \"creatorDisplayName\": \"Dr. S. Rahman\",\n                \"timerConfig\": {\n                  \"pretestSec\": 900,\n                  \"trialOrientationSec\": 900,\n                  \"roundMappingSec\": 1200,\n                  \"roundAdjudicationSec\": 600,\n                  \"posttestSec\": 900,\n                  \"feedbackSurveySec\": 900\n                }\n              }\n          auth:\n            type: bearer\n            token: '{{accountToken}}'\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                if (res.status === 201 && res.body) {\n                  bru.setEnvVar(\"sessionId\", res.body.sessionId);\n                  bru.setEnvVar(\"roomCode\", res.body.roomCode);\n                  if (res.body.instructorToken) {\n                    bru.setEnvVar(\"instructorToken\", res.body.instructorToken);\n                  }\n                  if (res.body.participantToken) {\n                    bru.setEnvVar(\"participantToken\", res.body.participantToken);\n                  }\n                }\n            - type: tests\n              code: |-\n                test(\"creates a Classroom Game Session and issues an instructor Capability Token\", function() {\n                  expect(res.status).to.equal(201);\n                  expect(res.body.sessionId).to.be.a(\"string\");\n                  expect(res.body.roomCode).to.match(/^[A-Z0-9]{6}$/);\n                  expect(res.body.instructorToken).to.be.a(\"string\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # POST /api/v1/sessions (`createGameSession`)\n\n          Starts a new **Game Session** pinned to the latest **Pack Version** of `packId` (`{{packId}}`), starting in the `pretest` phase and generating a 6-character alphanumeric `roomCode`.\n\n          - When `mode` is `\"classroom\"` or `\"study-rct\"`, an **Account Token** (`{{accountToken}}`) is required and the response returns an `instructorToken` (**Capability Token**).\n          - When `mode` is `\"solo\"`, no Account Token is needed and the caller receives a `participantToken` (plus `instructorToken` for phase transitions).\n          - Setting any `timerConfig` duration to `null` makes that phase instructor-driven (`phaseEndsAt: null`).\n\n          ## Automatic Variable Chaining\n          On `201 Created`, `script:post-response` saves:\n          - `{{sessionId}}`\n          - `{{roomCode}}`\n          - `{{instructorToken}}`\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`201 Created`**: `{ sessionId, roomCode, instructorToken, participantId, participantToken, state }`\n          - **`400 INVALID_REQUEST_BODY`**: Invalid `mode`, `adjudicationMode`, `seed`, or `timerConfig` bounds (must be `1..86400` or `null`).\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing or invalid Account Token for a `classroom` or `study-rct` session.\n          - **`404 PACK_NOT_FOUND`**: Unknown `packId`.\n          - **`413 PAYLOAD_TOO_LARGE`**: Request body exceeds 256 KB.\n          - **`422 PACK_VALIDATION_FAILED`**: Stored pack has fewer Keyword Cards than `rows * cols`.\n      - info:\n          name: Join Game Session\n          type: http\n          seq: 2\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/sessions/join'\n          body:\n            type: json\n            data: |-\n              {\n                \"roomCode\": \"{{roomCode}}\",\n                \"displayName\": \"Alice\"\n              }\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                if (res.status === 200 && res.body) {\n                  bru.setEnvVar(\"participantId\", res.body.participantId);\n                  bru.setEnvVar(\"participantToken\", res.body.participantToken);\n                  if (res.body.sessionId) {\n                    bru.setEnvVar(\"sessionId\", res.body.sessionId);\n                  }\n                }\n            - type: tests\n              code: |-\n                test(\"joins the Game Session via roomCode and issues a participant Capability Token\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.participantId).to.be.a(\"string\");\n                  expect(res.body.participantToken).to.be.a(\"string\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # POST /api/v1/sessions/join (`joinGameSession`)\n\n          Enrolls a learner in a **Game Session** using its 6-character `roomCode` (`{{roomCode}}`) and a chosen `displayName`, returning a session-scoped participant **Capability Token** (`role: \"participant\"`).\n\n          ## Automatic Variable Chaining\n          On `200 OK`, `script:post-response` saves:\n          - `{{participantId}}`\n          - `{{participantToken}}`\n          - `{{sessionId}}`\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: `{ sessionId, participantId, participantToken, state }`\n          - **`400 INVALID_REQUEST_BODY`**: Missing or invalid `roomCode` (`details.field: \"roomCode\"`).\n          - **`404 ROOM_CODE_NOT_FOUND`**: No active Game Session matches `roomCode`.\n          - **`409 CONCURRENT_UPDATE_CONFLICT`**: Optimistic concurrency conflict after 3 retries.\n          - **`413 PAYLOAD_TOO_LARGE`**: Request body exceeds 256 KB.\n      - info:\n          name: Get Game Session State\n          type: http\n          seq: 3\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/v1/sessions/{{sessionId}}'\n          auth:\n            type: bearer\n            token: '{{instructorToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"returns the current Game Session state and participant roster\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.sessionId).to.be.a(\"string\");\n                  expect(res.body.participants).to.be.an(\"array\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # GET /api/v1/sessions/:sessionId (`getGameSessionState`)\n\n          Returns the public state projection of a **Game Session**, including `phase`, `activeRoundNumber`, `phaseStartedAt`, `phaseEndsAt`, `participantCount`, `participants` roster (`participantId`, `displayName`, `joinedAt`, `leftAt`), and `activeBoard` (dealt grid of Keyword Cards once a Gameplay Round begins).\n\n          ## Authentication\n          - **`BearerAuth`**: `Authorization: Bearer {{instructorToken}}` or `{{participantToken}}` belonging to this `sessionId`.\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: `{ state: PublicSessionState }`\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing, invalid, or Account Token instead of a session Capability Token.\n          - **`403 FORBIDDEN_ROLE`**: Capability Token belongs to a different Game Session.\n          - **`404 SESSION_NOT_FOUND`**: Unknown `sessionId`.\n      - info:\n          name: Transition Session Phase\n          type: http\n          seq: 4\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/sessions/{{sessionId}}/phase'\n          body:\n            type: json\n            data: |-\n              {\n                \"action\": \"advance\"\n              }\n          auth:\n            type: bearer\n            token: '{{instructorToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"advances the Game Session to the next phase\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.state.phase).to.be.a(\"string\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # POST /api/v1/sessions/:sessionId/phase (`transitionSessionPhase`)\n\n          Advances a **Game Session** to the next phase in the 11-phase sequence (`action: \"advance\"`, or `action: \"jump\"` with `targetPhase` set to the immediate next phase).\n\n          When transitioning into `round-1:chain-mapping` or `round-2:chain-mapping`, the server deterministically deals a shuffled board grid (`state.activeBoard`) using the optional `seed` (or a generated seed).\n\n          > **Manual Testing Tip:** Run this request **twice** from `pretest` (`pretest` \u2192 `trial-orientation` \u2192 `round-1:chain-mapping`) before running `05-Chains-and-Adjudication/01-submit-chain.bru`!\n\n          ## Authentication\n          - **`BearerAuth` (`role: \"instructor\"`)**: `Authorization: Bearer {{instructorToken}}`\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: `{ previousPhase, state }`\n          - **`400 INVALID_REQUEST_BODY`**: Missing/invalid `action`, `jump` without `targetPhase`, or empty `seed`.\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing or invalid Capability Token.\n          - **`403 FORBIDDEN_ROLE`**: Caller is a `participant` or holds a token for another session.\n          - **`404 SESSION_NOT_FOUND`**: Unknown `sessionId`.\n          - **`409 INVALID_PHASE_TRANSITION`**: Attempting to skip phases, move backwards, or advance past `completed`.\n          - **`413 PAYLOAD_TOO_LARGE`**: Request body exceeds 256 KB.\n      - info:\n          name: Extend Session Phase\n          type: http\n          seq: 5\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/sessions/{{sessionId}}/phase/extend'\n          body:\n            type: json\n            data: |-\n              {\n                \"seconds\": 60\n              }\n          auth:\n            type: bearer\n            token: '{{instructorToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"extends the current timed phase deadline by 60 seconds\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.state.phaseEndsAt).to.be.a(\"string\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # POST /api/v1/sessions/:sessionId/phase/extend (`extendSessionPhase`)\n\n          Adds `seconds` (`1..600`) to the current phase's deadline (`phaseEndsAt`). If a timed Chain-Mapping phase had already expired, extending it re-opens submissions until the new deadline (+ 5-second grace period).\n\n          ## Authentication\n          - **`BearerAuth` (`role: \"instructor\"`)**: `Authorization: Bearer {{instructorToken}}`\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: `{ state: PublicSessionState }`\n          - **`400 INVALID_REQUEST_BODY`**: `seconds` is missing, non-integer, `< 1`, or `> 600`.\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing or invalid Capability Token.\n          - **`403 FORBIDDEN_ROLE`**: Caller is a `participant` or holds a token for another session.\n          - **`404 SESSION_NOT_FOUND`**: Unknown `sessionId`.\n          - **`409 PHASE_HAS_NO_TIMER`**: Current phase is instructor-driven (`phaseEndsAt: null`).\n          - **`409 SESSION_ALREADY_COMPLETED`**: Session is already in the `completed` phase.\n          - **`413 PAYLOAD_TOO_LARGE`**: Request body exceeds 256 KB.\n  - info:\n      name: 05-Chains-and-Adjudication\n      type: folder\n      seq: 5\n    docs:\n      content: |-\n        # Concept Chains, Peer Adjudication, Instructor Final Rulings & Standings\n\n        During a **Gameplay Round** (`round-1:chain-mapping` / `round-2:chain-mapping`), learners submit **Concept Chains** connecting adjacent **Keyword Cards** on the server-dealt board grid.\n\n        During `round-1:peer-adjudication` / `round-2:peer-adjudication`, classmates view the round's chains, cast peer votes (`peer-approve` / `peer-reject`), and the supervising instructor can issue an **Instructor Final Ruling** (`instructor-approve` / `instructor-reject`) that permanently locks the verdict.\n      type: text/markdown\n    items:\n      - info:\n          name: Submit Concept Chain\n          type: http\n          seq: 1\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/sessions/{{sessionId}}/rounds/{{roundNumber}}/chains'\n          body:\n            type: json\n            data: |-\n              {\n                \"path\": [\n                  { \"row\": 0, \"col\": 0 },\n                  { \"row\": 0, \"col\": 1 },\n                  { \"row\": 1, \"col\": 1 },\n                  { \"row\": 1, \"col\": 2 }\n                ],\n                \"narrativeExplanation\": \"Insulin resistance impairs peripheral GLUT4 glucose uptake, leading to compensatory beta-cell hypersecretion and eventual postprandial hyperglycemia.\",\n                \"stepRationales\": [\n                  \"Step 1 -> 2: Receptor signaling regulates transporter translocation.\",\n                  \"Step 2 -> 3: Reduced peripheral clearance stimulates pancreatic compensation.\",\n                  \"Step 3 -> 4: Progressive secretory failure results in chronic hyperglycemia.\"\n                ]\n              }\n          auth:\n            type: bearer\n            token: '{{participantToken}}'\n        runtime:\n          scripts:\n            - type: before-request\n              code: |-\n                const baseUrl = bru.getEnvVar(\"baseUrl\");\n                const apiKey = bru.getEnvVar(\"apiKey\");\n                const sessionId = bru.getEnvVar(\"sessionId\");\n                const instructorToken = bru.getEnvVar(\"instructorToken\");\n                if (sessionId && instructorToken) {\n                  for (let i = 0; i < 3; i++) {\n                    const stateRes = await bru.sendRequest({\n                      url: `${baseUrl}/api/v1/sessions/${sessionId}`,\n                      method: \"GET\",\n                      headers: { \"x-api-key\": apiKey, Authorization: `Bearer ${instructorToken}` }\n                    });\n                    if (stateRes.data && stateRes.data.phase === \"round-1:chain-mapping\") {\n                      break;\n                    }\n                    await bru.sendRequest({\n                      url: `${baseUrl}/api/v1/sessions/${sessionId}/phase`,\n                      method: \"POST\",\n                      headers: { \"Content-Type\": \"application/json\", \"x-api-key\": apiKey, Authorization: `Bearer ${instructorToken}` },\n                      data: { action: \"advance\" }\n                    });\n                  }\n                }\n            - type: after-response\n              code: |-\n                if (res.status === 201 && res.body && res.body.chain) {\n                  bru.setEnvVar(\"chainId\", res.body.chain.chainId);\n                }\n            - type: tests\n              code: |-\n                test(\"submits a topologically valid Concept Chain and saves chainId\", function() {\n                  expect(res.status).to.equal(201);\n                  expect(res.body.chain.chainId).to.be.a(\"string\");\n                  expect(res.body.chain.chainLength).to.equal(4);\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # POST /api/v1/sessions/:sessionId/rounds/:roundNumber/chains (`submitConceptChain`)\n\n          Submits a learner's **Concept Chain** during `round-1:chain-mapping` or `round-2:chain-mapping`.\n\n          - The server validates that `path` has at least `boardConfig.minChainLength` cells (4 for `diabe-teach`), every cell is within the board bounds (`rows x cols`), consecutive cells are Chebyshev-8 adjacent (horizontal, vertical, or diagonal), no cell is visited twice, and the learner has not already submitted the same or reversed path in this round.\n          - `keywordIds` are automatically resolved by the server from the round's dealt `activeBoard`.\n\n          ## Automatic Variable Chaining\n          On `201 Created`, `script:post-response` saves:\n          - `{{chainId}}`\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`201 Created`**: `{ chain: SubmittedChain, state: PublicSessionState }`\n          - **`400 INVALID_REQUEST_BODY`**: `path` has fewer than 2 cells, negative coordinates, or empty `narrativeExplanation`.\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing or invalid Capability Token.\n          - **`403 FORBIDDEN_ROLE`**: Caller is an `instructor` or holds a token for another session.\n          - **`403 PARTICIPANT_HAS_LEFT`**: Learner has left the Game Session (`POST /leave`).\n          - **`404 SESSION_NOT_FOUND`**: Unknown `sessionId`.\n          - **`409 PHASE_CLOSED_FOR_SUBMISSIONS`**: Session is not in `round-{N}:chain-mapping`, `:roundNumber` does not match the active round, or `phaseEndsAt` + 5s grace period has elapsed.\n          - **`409 CHAIN_ALREADY_SUBMITTED`**: Same learner already submitted this path (or its exact reverse) in this round.\n          - **`413 PAYLOAD_TOO_LARGE`**: Request body exceeds 256 KB.\n          - **`422 CHAIN_TOPOLOGY_INVALID`**: Path is shorter than `minChainLength`, has non-adjacent or duplicate cells, or references coordinates outside the board grid.\n      - info:\n          name: List Round Chains\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/v1/sessions/{{sessionId}}/rounds/{{roundNumber}}/chains'\n          auth:\n            type: bearer\n            token: '{{instructorToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"lists the round's Concept Chains with author and voter display names\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.roundNumber).to.be.a(\"number\");\n                  expect(res.body.chains).to.be.an(\"array\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # GET /api/v1/sessions/:sessionId/rounds/:roundNumber/chains (`listRoundChains`)\n\n          Lists the **Concept Chains** submitted for Gameplay Round `:roundNumber` (`1` or `2`), enriched with `participantDisplayName` and each peer vote's `voterDisplayName`.\n\n          ## Visibility Rule\n          - **Supervising Instructor (`{{instructorToken}}`)**: Sees all chains in the round at all times.\n          - **Learner (`{{participantToken}}`)**: During `round-{N}:chain-mapping`, sees **only their own** chains; from `round-{N}:peer-adjudication` onward, sees **all classmates' chains** in that round.\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: `{ sessionId, roundNumber, chains: SubmittedChainListItem[] }`\n          - **`400 INVALID_REQUEST_BODY`**: `:roundNumber` is not `1` or `2`.\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing, invalid, or Account Token instead of a session Capability Token.\n          - **`403 FORBIDDEN_ROLE`**: Token belongs to another Game Session.\n          - **`404 SESSION_NOT_FOUND`**: Unknown `sessionId`.\n      - info:\n          name: Adjudicate Concept Chain\n          type: http\n          seq: 3\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/sessions/{{sessionId}}/rounds/{{roundNumber}}/chains/{{chainId}}/adjudicate'\n          body:\n            type: json\n            data: |-\n              {\n                \"action\": \"instructor-approve\",\n                \"qualityScore\": 8,\n                \"feedback\": \"Clear mechanistic narrative linking insulin resistance, GLUT4 translocation, and beta-cell compensation.\"\n              }\n          auth:\n            type: bearer\n            token: '{{instructorToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"records the Instructor Final Ruling and locks the chain verdict\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.chain.status).to.equal(\"approved\");\n                  expect(res.body.chain.verdict.isLocked).to.equal(true);\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # POST /api/v1/sessions/:sessionId/rounds/:roundNumber/chains/:chainId/adjudicate (`adjudicateConceptChain`)\n\n          Records either a learner's peer vote or an **Instructor Final Ruling** on Concept Chain `{{chainId}}`.\n\n          ## Discriminated Request Payloads (`action`)\n          1. **Instructor Final Ruling** (requires `{{instructorToken}}`, permanently locks `chain.verdict.isLocked = true`):\n             ```json\n             {\n               \"action\": \"instructor-approve\",\n               \"qualityScore\": 8,\n               \"feedback\": \"Sound mechanistic rationale across all four cards.\"\n             }\n             ```\n             *(or `\"action\": \"instructor-reject\"` with required non-empty `\"feedback\"` and optional `\"qualityScore\"` `1..10`)*\n          2. **Learner Peer Vote** (use `{{participantToken}}` or `{{instructorToken}}` before the chain is locked):\n             ```json\n             {\n               \"action\": \"peer-approve\",\n               \"reason\": \"Consecutive cards are physiologically connected.\"\n             }\n             ```\n             *(or `\"action\": \"peer-reject\"`)*\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: `{ chain: SubmittedChain }`\n          - **`400 INVALID_REQUEST_BODY`**: Unknown `action`, missing/empty `feedback` on an instructor ruling, or `qualityScore` outside `1..10`.\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing or invalid Capability Token.\n          - **`403 FORBIDDEN_ROLE`**: A `participant` attempted `instructor-approve` or `instructor-reject`, or token belongs to another session.\n          - **`403 PARTICIPANT_HAS_LEFT`**: Learner has left the Game Session.\n          - **`404 SESSION_NOT_FOUND`** / **`404 CHAIN_NOT_FOUND`**: Unknown `sessionId` or `chainId`.\n          - **`409 ADJUDICATION_LOCKED_BY_INSTRUCTOR`**: Chain verdict is already locked by an Instructor Final Ruling.\n          - **`413 PAYLOAD_TOO_LARGE`**: Request body exceeds 256 KB.\n      - info:\n          name: Get Round Standings\n          type: http\n          seq: 4\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/v1/sessions/{{sessionId}}/rounds/{{roundNumber}}/standings'\n          auth:\n            type: bearer\n            token: '{{instructorToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"returns sorted Gameplay Round standings\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.standings).to.be.an(\"array\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # GET /api/v1/sessions/:sessionId/rounds/:roundNumber/standings (`getRoundStandings`)\n\n          Returns the participant leaderboard (`rank`, `participantId`, `displayName`, `longestValidChainLength`, `approvedChainCount`, `totalSubmittedChains`) for Gameplay Round `:roundNumber`.\n\n          ## Authentication\n          - **`BearerAuth`**: `Authorization: Bearer {{instructorToken}}` or `{{participantToken}}` belonging to this `sessionId`.\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: `{ sessionId, roundNumber, standings: RoundStandingEntry[] }`\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing or invalid Capability Token.\n          - **`403 FORBIDDEN_ROLE`**: Token belongs to another Game Session.\n          - **`404 SESSION_NOT_FOUND`**: Unknown `sessionId`.\n  - info:\n      name: 06-Assessments-Survey-and-Lifecycle\n      type: folder\n      seq: 6\n    docs:\n      content: |-\n        # Pretest/Posttest Assessment Attempts, Analytics, Perception Survey & Session Exit\n\n        Covers the metacognitive assessment and end-of-session lifecycle endpoints:\n        - **Assessment Attempts** (`POST /api/v1/sessions/:sessionId/assessments/:stage` for `pretest` and `posttest` with explicit `\"I_DONT_KNOW\"` **Uncertainty Calibration**).\n        - **Session Analytics** (`GET /api/v1/sessions/:sessionId/analytics` returning **Chain Diversity Index**, **Board Neglect Heatmap**, knowledge gain, and guessing reduction).\n        - **Perception Survey** (`POST /api/v1/sessions/:sessionId/survey` with 9 Likert items `1..5` and optional comments).\n        - **Learner Leave & Instructor End Session** (`POST /api/v1/sessions/:sessionId/leave` and `POST /api/v1/sessions/:sessionId/end`).\n      type: text/markdown\n    items:\n      - info:\n          name: Submit Assessment Attempt\n          type: http\n          seq: 1\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/sessions/{{sessionId}}/assessments/{{assessmentStage}}'\n          body:\n            type: json\n            data: |-\n              {\n                \"answers\": {\n                  \"dm-mcq-01\": 0,\n                  \"dm-mcq-02\": 1,\n                  \"dm-mcq-03\": 2,\n                  \"dm-mcq-04\": 3,\n                  \"dm-mcq-05\": \"I_DONT_KNOW\",\n                  \"dm-mcq-06\": 0,\n                  \"dm-mcq-07\": 1,\n                  \"dm-mcq-08\": 2,\n                  \"dm-mcq-09\": 3,\n                  \"dm-mcq-10\": \"I_DONT_KNOW\"\n                }\n              }\n          auth:\n            type: bearer\n            token: '{{participantToken}}'\n        runtime:\n          scripts:\n            - type: before-request\n              code: |-\n                const baseUrl = bru.getEnvVar(\"baseUrl\");\n                const apiKey = bru.getEnvVar(\"apiKey\");\n                const sessionId = bru.getEnvVar(\"sessionId\");\n                const instructorToken = bru.getEnvVar(\"instructorToken\");\n                const stage = bru.getEnvVar(\"assessmentStage\") || \"pretest\";\n                if (sessionId && instructorToken) {\n                  const stateRes = await bru.sendRequest({\n                    url: `${baseUrl}/api/v1/sessions/${sessionId}`,\n                    method: \"GET\",\n                    headers: { \"x-api-key\": apiKey, Authorization: `Bearer ${instructorToken}` }\n                  });\n                  if (stateRes.data && stateRes.data.phase !== stage) {\n                    const accountToken = bru.getEnvVar(\"accountToken\");\n                    const packId = bru.getEnvVar(\"packId\") || \"diabe-teach\";\n                    const createRes = await bru.sendRequest({\n                      url: `${baseUrl}/api/v1/sessions`,\n                      method: \"POST\",\n                      headers: { \"Content-Type\": \"application/json\", \"x-api-key\": apiKey, Authorization: `Bearer ${accountToken}` },\n                      data: { packId, mode: \"classroom\", adjudicationMode: \"peer-instructor\" }\n                    });\n                    if (createRes.status === 201 && createRes.data) {\n                      bru.setEnvVar(\"sessionId\", createRes.data.sessionId);\n                      bru.setEnvVar(\"roomCode\", createRes.data.roomCode);\n                      bru.setEnvVar(\"instructorToken\", createRes.data.instructorToken);\n                      const joinRes = await bru.sendRequest({\n                        url: `${baseUrl}/api/v1/sessions/join`,\n                        method: \"POST\",\n                        headers: { \"Content-Type\": \"application/json\", \"x-api-key\": apiKey },\n                        data: { roomCode: createRes.data.roomCode, displayName: \"Alice\" }\n                      });\n                      if (joinRes.status === 200 && joinRes.data) {\n                        bru.setEnvVar(\"participantId\", joinRes.data.participantId);\n                        bru.setEnvVar(\"participantToken\", joinRes.data.participantToken);\n                      }\n                    }\n                  }\n                }\n            - type: tests\n              code: |-\n                test(\"records the learner's Assessment Attempt and scores Uncertainty Calibration\", function() {\n                  expect(res.status).to.equal(201);\n                  expect(res.body.stage).to.be.a(\"string\");\n                  expect(res.body.recordedCount).to.equal(10);\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # POST /api/v1/sessions/:sessionId/assessments/:stage (`submitAssessmentAttempt`)\n\n          Submits a learner's **Assessment Attempt** at either `:stage = pretest` (during the `pretest` phase) or `:stage = posttest` (during the `posttest` phase, requiring a completed Pretest from the same learner).\n\n          - Every question in the Curriculum Pack's `assessmentInstrument` must be answered with an option index (`0 | 1 | 2 | 3`) or `\"I_DONT_KNOW\"` (**Uncertainty Calibration**).\n          - Change `{{assessmentStage}}` from `pretest` to `posttest` when testing the `posttest` phase; a `posttest` response also includes the learner's pre/post comparison `report`.\n\n          ## Authentication\n          - **`BearerAuth` (`role: \"participant\"`)**: `Authorization: Bearer {{participantToken}}`\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`201 Created`**: `{ attempt: AssessmentAttemptResult, report: ParticipantAnalyticsReport | null }`\n          - **`400 INVALID_REQUEST_BODY`**: Missing `answers` or answer value outside `0..3 | \"I_DONT_KNOW\"`.\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing or invalid Capability Token.\n          - **`403 FORBIDDEN_ROLE`**: Caller is an `instructor` or holds a token for another session.\n          - **`403 PARTICIPANT_HAS_LEFT`**: Learner has left the Game Session.\n          - **`404 SESSION_NOT_FOUND`**: Unknown `sessionId`.\n          - **`409 ASSESSMENT_ALREADY_SUBMITTED`**: Learner already submitted an attempt for this stage.\n          - **`409 PHASE_CLOSED_FOR_SUBMISSIONS`**: Session is not in the matching `pretest`/`posttest` phase, or learner is attempting `posttest` without having completed `pretest`.\n          - **`413 PAYLOAD_TOO_LARGE`**: Request body exceeds 256 KB.\n          - **`422 ASSESSMENT_INCOMPLETE`**: Missing answers for one or more required assessment questions.\n      - info:\n          name: Get Session Analytics\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/v1/sessions/{{sessionId}}/analytics'\n          auth:\n            type: bearer\n            token: '{{participantToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"returns role-scoped Game Session analytics and cohortSummary\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.cohortSummary.sessionId).to.be.a(\"string\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # GET /api/v1/sessions/:sessionId/analytics (`getSessionAnalytics`)\n\n          Computes live metacognitive and gameplay analytics for a **Game Session**:\n          - **Learner (`{{participantToken}}`)**: Receives `{ role: \"participant\", participantReport, cohortSummary }`, where `participantReport` contains `pretest`, `posttest`, `knowledgeGainDelta`, `guessingReductionDelta`, `chainDiversityIndex`, and `neglectedKeywordIds`.\n          - **Instructor (`{{instructorToken}}`)**: Receives `{ role: \"instructor\", cohortSummary }`, where `cohortSummary` contains `sessionId`, `participantCount`, `meanPretestScore`, `meanPosttestScore`, `meanKnowledgeGainDelta`, `meanGuessingReductionDelta`, `meanChainDiversityIndex`, and `boardNeglectHeatmap`.\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: Role-scoped analytics payload.\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing or invalid Capability Token.\n          - **`403 FORBIDDEN_ROLE`**: Token belongs to another Game Session.\n          - **`404 SESSION_NOT_FOUND`**: Unknown `sessionId`.\n      - info:\n          name: Submit Perception Survey\n          type: http\n          seq: 3\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/sessions/{{sessionId}}/survey'\n          body:\n            type: json\n            data: |-\n              {\n                \"responses\": {\n                  \"survey-q1\": 5,\n                  \"survey-q2\": 4,\n                  \"survey-q3\": 5,\n                  \"survey-q4\": 4,\n                  \"survey-q5\": 5,\n                  \"survey-q6\": 4,\n                  \"survey-q7\": 5,\n                  \"survey-q8\": 4,\n                  \"survey-q9\": 5\n                },\n                \"comments\": \"Building Concept Chains across metabolic and clinical domains helped clarify the pathophysiology.\"\n              }\n          auth:\n            type: bearer\n            token: '{{participantToken}}'\n        runtime:\n          scripts:\n            - type: before-request\n              code: |-\n                const baseUrl = bru.getEnvVar(\"baseUrl\");\n                const apiKey = bru.getEnvVar(\"apiKey\");\n                const sessionId = bru.getEnvVar(\"sessionId\");\n                const instructorToken = bru.getEnvVar(\"instructorToken\");\n                if (sessionId && instructorToken) {\n                  for (let i = 0; i < 11; i++) {\n                    const stateRes = await bru.sendRequest({\n                      url: `${baseUrl}/api/v1/sessions/${sessionId}`,\n                      method: \"GET\",\n                      headers: { \"x-api-key\": apiKey, Authorization: `Bearer ${instructorToken}` }\n                    });\n                    if (stateRes.data && stateRes.data.phase === \"feedback-survey\") {\n                      break;\n                    }\n                    await bru.sendRequest({\n                      url: `${baseUrl}/api/v1/sessions/${sessionId}/phase`,\n                      method: \"POST\",\n                      headers: { \"Content-Type\": \"application/json\", \"x-api-key\": apiKey, Authorization: `Bearer ${instructorToken}` },\n                      data: { action: \"advance\" }\n                    });\n                  }\n                }\n            - type: tests\n              code: |-\n                test(\"records the learner's perception survey responses\", function() {\n                  expect(res.status).to.equal(201);\n                  expect(res.body.recordedItemCount).to.equal(9);\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # POST /api/v1/sessions/:sessionId/survey (`submitPerceptionSurvey`)\n\n          Submits a learner's post-game Likert perception survey (`1..5` ratings across all 9 survey items plus optional free-text `comments` up to 1,000 words) during the `feedback-survey` phase.\n\n          ## Authentication\n          - **`BearerAuth` (`role: \"participant\"`)**: `Authorization: Bearer {{participantToken}}`\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`201 Created`**: `{ sessionId, submittedAt, recordedItemCount }`\n          - **`400 INVALID_REQUEST_BODY`**: Missing `responses` or Likert rating outside `1..5` (`details.field: \"responses.<itemId>\"`).\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing or invalid Capability Token.\n          - **`403 FORBIDDEN_ROLE`**: Caller is an `instructor` or holds a token for another session.\n          - **`403 PARTICIPANT_HAS_LEFT`**: Learner has left the Game Session.\n          - **`404 SESSION_NOT_FOUND`**: Unknown `sessionId`.\n          - **`409 SURVEY_ALREADY_SUBMITTED`**: Learner already submitted the perception survey in this session.\n          - **`409 PHASE_CLOSED_FOR_SUBMISSIONS`**: Session is not in the `feedback-survey` phase.\n          - **`413 PAYLOAD_TOO_LARGE`**: Request body exceeds 256 KB.\n          - **`422 SURVEY_COMMENTS_TOO_LONG`**: Free-text `comments` exceed 1,000 words.\n      - info:\n          name: Leave Game Session\n          type: http\n          seq: 4\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/sessions/{{sessionId}}/leave'\n          auth:\n            type: bearer\n            token: '{{participantToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"marks the learner as having left the Game Session\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.state.sessionId).to.be.a(\"string\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # POST /api/v1/sessions/:sessionId/leave (`leaveGameSession`)\n\n          Marks the calling learner (`{{participantToken}}`) as departed (`leftAt` timestamp set on the roster, `participantCount` decremented). Calling `leave` a second time is an idempotent `200 OK` no-op.\n\n          Once a learner has left, read endpoints (`getGameSessionState`, `listRoundChains`, `getRoundStandings`) still succeed, while write endpoints (`submitConceptChain`, `adjudicateConceptChain`, `submitAssessmentAttempt`, `submitPerceptionSurvey`) refuse with `403 PARTICIPANT_HAS_LEFT`.\n\n          ## Authentication\n          - **`BearerAuth` (`role: \"participant\"`)**: `Authorization: Bearer {{participantToken}}`\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: `{ state: PublicSessionState }`\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing or invalid Capability Token.\n          - **`403 FORBIDDEN_ROLE`**: Caller is an `instructor` (instructors use `POST /end` instead) or token belongs to another session.\n          - **`404 SESSION_NOT_FOUND`**: Unknown `sessionId`.\n      - info:\n          name: End Game Session\n          type: http\n          seq: 5\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/sessions/{{sessionId}}/end'\n          auth:\n            type: bearer\n            token: '{{instructorToken}}'\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"ends the Game Session and moves it to completed\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.state.phase).to.equal(\"completed\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # POST /api/v1/sessions/:sessionId/end (`endGameSession`)\n\n          Immediately terminates a **Game Session** from any active phase and transitions it to `completed`, clearing any phase timer extension.\n\n          ## Authentication\n          - **`BearerAuth` (`role: \"instructor\"`)**: `Authorization: Bearer {{instructorToken}}`\n\n          ## Responses & Error Codes (`ApiErrorCode`)\n          - **`200 OK`**: `{ previousPhase, state }` (`state.phase === \"completed\"`)\n          - **`401 UNAUTHORIZED_TOKEN`**: Missing or invalid Capability Token.\n          - **`403 FORBIDDEN_ROLE`**: Caller is a `participant` or holds a token for another session.\n          - **`404 SESSION_NOT_FOUND`**: Unknown `sessionId`.\n          - **`409 SESSION_ALREADY_COMPLETED`**: Session is already in the `completed` phase.\nrequest:\n  headers:\n    - name: x-api-key\n      value: '{{apiKey}}'\n    - name: Accept\n      value: application/json\ndocs:\n  content: |-\n    # Diabe-teach Concept-Chain Educational Game Engine API\n\n    Subject-agnostic HTTP REST API for running associative concept-chaining board games, with **Diabe-teach** (Diabetes Mellitus) as the inaugural built-in **System Pack**.\n\n    ---\n\n    ## Quick Start (Local Manual Testing)\n\n    1. Start the local Netlify Functions v2 + in-memory MongoDB server:\n       ```bash\n       npm run dev:local\n       ```\n       Wait until the terminal prints `DEV READY http://localhost:8888`.\n    2. Open `docs/api/bruno/` in the **Bruno Desktop App** (or open `docs/api/api-docs.html` in a browser).\n    3. Select the **`Local Dev`** environment in the top-right dropdown (`baseUrl: http://localhost:8888`, `apiKey: dev-local-api-key`).\n    4. Walk the numbered folders **`01` through `06` top-to-bottom**. Every token and resource identifier (`accountToken`, `accountId`, `sessionId`, `roomCode`, `instructorToken`, `participantId`, `participantToken`, `chainId`) is automatically captured by `script:post-response` hooks and chained into subsequent requests\u2014no manual copy-pasting required.\n    5. When finished, stop the local server cleanly:\n       ```bash\n       npm run dev:local:stop\n       ```\n\n    ---\n\n    ## Authentication Architecture (ADR-0007)\n\n    Every `/api/v1/*` request carries `x-api-key: {{apiKey}}` (configured at the collection level). Protected routes require one of **two distinct, non-interchangeable HS256 JWT bearer token kinds**:\n\n    | Token Kind | OpenAPI Security Scheme | Environment Variable(s) | Issued By | Accepted By |\n    |---|---|---|---|---|\n    | **Account Token** (`AccountToken`) | `AccountAuth` | `{{accountToken}}` | `POST /api/v1/accounts/sign-up`<br>`POST /api/v1/accounts/sign-in` | `GET /api/v1/accounts/me`<br>`POST /api/v1/packs/validate`<br>`POST /api/v1/packs`<br>`POST /api/v1/packs/:packId/archive`<br>`POST /api/v1/packs/:packId/unarchive`<br>`POST /api/v1/sessions` (when `mode` is `classroom` or `study-rct`) |\n    | **Capability Token** (`CapabilityToken`) | `BearerAuth` | `{{instructorToken}}` (`role: \"instructor\"`)<br>`{{participantToken}}` (`role: \"participant\"`) | `POST /api/v1/sessions`<br>`POST /api/v1/sessions/join` | All `/api/v1/sessions/:sessionId/*` routes and optional answer-key unredaction on `GET /api/v1/packs/:packId` |\n\n    ---\n\n    ## 11-Phase Game Session Lifecycle\n\n    A Game Session progresses in strict order through 11 phases via `POST /api/v1/sessions/:sessionId/phase` (`{ \"action\": \"advance\" }`):\n\n    1. `pretest` (Pretest Assessment Attempt)\n    2. `trial-orientation` (Calibration Examples)\n    3. `round-1:chain-mapping` (Server deals Round 1 board; learners submit Concept Chains)\n    4. `round-1:peer-adjudication` (Peer votes & Instructor Final Rulings)\n    5. `round-1:round-summary` (Round 1 standings)\n    6. `round-2:chain-mapping` (Server deals Round 2 board; learners submit Concept Chains)\n    7. `round-2:peer-adjudication` (Peer votes & Instructor Final Rulings)\n    8. `round-2:round-summary` (Round 2 standings)\n    9. `posttest` (Posttest Assessment Attempt & knowledge gain report)\n    10. `feedback-survey` (9-item Likert perception survey)\n    11. `completed` (Final cohort & participant analytics)\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n    exportedAt: '2026-11-24T02:18:54.785Z'\n    exportedUsing: usebruno-cli/4.3.0\n";
        new window.OpenCollection({
