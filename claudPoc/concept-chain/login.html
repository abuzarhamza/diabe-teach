<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concept Chain · Teacher login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
.login{max-width:440px;width:100%;margin:8vh auto 0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
#why{border:1px solid var(--warn);border-radius:8px;padding:8px 10px;color:var(--ink);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.foot{font-size:13px;color:var(--muted)}
.foot a{color:var(--accent)}
.login-tools{display:flex;justify-content:flex-end;gap:8px}
[hidden]{display:none !important} /* .panel/.col set display:flex, which would override the hidden attribute */
</style>
</head>
<body>
<div class="wrap">
  <section class="panel login">
    <div class="login-tools" data-api-toggle></div>
    <div class="brand"><h1>Concept <span>Chain</span></h1><p>Teacher login</p></div>
    <p class="note" id="why" role="alert" hidden></p>

    <div class="col" id="signedIn" data-api="L.me" data-api-io="read" hidden>
      <p>Signed in as <b id="who"></b></p>
      <div class="row">
        <a class="btn primary" href="setup.html" id="continue">Continue to Game setup →</a>
        <button class="btn sm" type="button" id="signOut">Sign out</button>
      </div>
    </div>

    <form id="loginForm" class="col" data-api="L" data-api-io="write" novalidate hidden>
      <div class="field"><label for="email">Email</label><input type="email" id="email" maxlength="254" autocomplete="username" required placeholder="name@school.org"></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" maxlength="1024" autocomplete="current-password" required aria-describedby="pwNote"><span class="note" id="pwNote">At least 10 characters.</span></div>
      <div class="row">
        <button class="btn primary" type="submit" id="signInBtn" data-api="L.signIn" data-api-io="write">Sign in</button>
        <button class="btn" type="button" id="signUpBtn" data-api="L.signUp" data-api-io="write">Create account</button>
      </div>
      <div class="toast" id="msg" role="status" aria-live="polite"></div>
    </form>
    <p class="foot">Learners don't sign in: they join with the room code on the <a href="participant.html">learner screen</a>.</p>
  </section>
</div>

<script src="shared.js"></script>
<script src="account-api.js"></script>
<script src="api-catalog.js"></script>
<script src="api-overlay.js"></script>
<script>
const $ = (id) => document.getElementById(id);
function render() {
  const a = CCApi.account();
  $("signedIn").hidden = !a; $("loginForm").hidden = !!a;
  if (a) $("who").textContent = a.email;
}
function showError(text, field) {
  $("msg").textContent = text; $("msg").className = "toast err";
  if (field) $(field).focus();
}
async function submit(kind) {
  const email = $("email").value, password = $("password").value;
  $("msg").textContent = ""; $("msg").className = "toast";
  for (const b of [$("signInBtn"), $("signUpBtn")]) b.disabled = true;
  try {
    await (kind === "up" ? CCApi.signUp(email, password) : CCApi.signIn(email, password));
    location.assign("setup.html");
  }
  catch (e) {
    const field = e.details?.field === "email" ? "email" : e.code === "EMAIL_ALREADY_REGISTERED" ? "email" : "password";
    showError(CCApi.loginErrorText(e), field);
  }
  finally { for (const b of [$("signInBtn"), $("signUpBtn")]) b.disabled = false; }
}
$("loginForm").addEventListener("submit", (e) => { e.preventDefault(); submit("in"); });
$("signUpBtn").addEventListener("click", () => submit("up"));
$("signOut").onclick = () => { CCApi.signOut(); render(); $("email").focus(); };
const why = CCApi.takeLoginMessage();
if (why) { $("why").textContent = why; $("why").hidden = false; }
window.addEventListener("storage", render);
render();
</script>
</body>
</html>
